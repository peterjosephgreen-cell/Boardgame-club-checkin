const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??structuredClone(d)}catch{return structuredClone(d)}};
let people=load('ccbg_people_v3',seed),att=load('ccbg_att_v3',[]),remembered=localStorage.getItem('ccbg_remembered_v3');
const save=()=>{localStorage.setItem('ccbg_people_v3',JSON.stringify(people));localStorage.setItem('ccbg_att_v3',JSON.stringify(att))};
const effectiveNow=()=>{let x=localStorage.getItem('ccbg_testdate');return x?new Date(x+'T12:00:00'):new Date()};
const day=()=>{let d=effectiveNow();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const niceDate=()=>new Intl.DateTimeFormat('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(effectiveNow());
const niceTime=i=>new Intl.DateTimeFormat('en-AU',{hour:'numeric',minute:'2-digit'}).format(new Date(i));
const person=id=>people.find(p=>p.id===id);const today=()=>att.filter(a=>a.date===day());const has=id=>today().find(a=>a.personId===id);
function currentSeason(){return effectiveNow()>=new Date('2026-11-25T00:00:00')?'26/27':'25/26'}
function membershipState(p){if(p.memberType==='visitor')return 'visitor';if(p.memberType==='lifetime')return 'lifetime';if(p.memberType==='child')return 'child';if(currentSeason()==='25/26')return p.paid2526?'active':'due';return p.paid2627?'active':'due'}
function stateLabel(p){let s=membershipState(p);return s==='lifetime'?'Lifetime':s==='child'?'Child':s==='visitor'?'Visitor':s==='due'?'Renewal due':currentSeason()==='26/27'?'26/27 Member':'25/26 Member'}
function pill(p){let s=membershipState(p),cl=s==='active'?(p.paid2627&&currentSeason()==='25/26'?'prepaid':'member'):s;return `<span class="pill ${cl}">${stateLabel(p)}</span>`}
function checkIn(id,method='qr'){let a=has(id);if(a)return a;a={id:'a'+Date.now(),personId:id,date:day(),time:new Date().toISOString(),method,membershipState:membershipState(person(id))};att.unshift(a);save();return a}
function remember(id){remembered=id;localStorage.setItem('ccbg_remembered_v3',id)}function phone(x){root.innerHTML=`<div class="phone">${x}</div>`}function hero(x){return `<section class="card hero"><img src="${LOGO}" alt="Central Coast Board Games logo"><div class="pad">${x}</div></section>`}
function showLanding(){let p=person(remembered);if(p)return showRecognised(p.id);phone(hero(`<div class="eyebrow">Welcome</div><h1>Game day starts here.</h1><p>Scan, check in, grab a game and settle in. It only takes a few seconds.</p><div class="stack"><button class="btn primary" onclick="showLookup()">Yes — I'm a member</button><button class="btn teal" onclick="showVisitor()">I'm new here</button></div>`))}
function membershipMessage(p){let s=membershipState(p);if(p.paid2627&&currentSeason()==='25/26'&&p.memberType==='adult')return `<div class="status-card good">🎉 <b>Your 2026/27 membership is already paid.</b><br><span class="hint">Nothing to do when renewals open.</span></div>`;if(s==='due')return `<div class="status-card warning">Your <b>2026/27 membership is due for renewal</b>. You can still check in and enjoy today's session.</div>`;if(s==='lifetime')return `<div class="status-card good">⭐ Lifetime member — no renewal required.</div>`;if(s==='child')return `<div class="status-card good">🧩 Child member — no membership payment required.</div>`;return ''}
function showRecognised(id){let p=person(id),a=has(id);phone(hero(`<div class="eyebrow">Welcome back</div><h1>Hi, ${p.first} 👋</h1><div class="meta">${pill(p)}${p.cclc?`<span class="pill soft">CCLC ${p.cclc}</span>`:`<span class="pill due">CCLC number missing</span>`}</div>${membershipMessage(p)}${a?`<div class="notice" style="margin-top:12px">✅ You're already checked in today at <b>${niceTime(a.time)}</b>.</div>`:`<p>Ready to check in for today's board game session?</p>`}<div class="stack">${a?`<button class="btn teal" onclick="showSuccess('${id}')">View check-in</button>`:`<button class="btn primary" onclick="doCheck('${id}')">Check me in</button>`}${membershipState(p)==='due'?`<button class="btn coral" onclick="simulateSquare('${id}')">Renew 2026/27 membership</button>`:''}${!p.cclc?`<button class="btn soft" onclick="updateCCLC('${id}')">Add CCLC number</button>`:''}<button class="text" onclick="switchPerson()">Not ${p.first}? Switch person</button></div>`))}
function switchPerson(){localStorage.removeItem('ccbg_remembered_v3');remembered=null;showLanding()}
function showLookup(msg=''){let members=people.filter(p=>p.memberType!=='visitor').sort((a,b)=>a.last.localeCompare(b.last)||a.first.localeCompare(b.first));phone(hero(`<div class="eyebrow">Member check-in</div><h2>Find your membership</h2><p>Select your name from the member list below.</p>${msg?`<div class="notice">${msg}</div>`:''}<form class="stack" onsubmit="lookup(event)"><div class="field"><label>Select your name</label><select name="memberId" required><option value="">Choose your name…</option>${members.map(p=>`<option value="${p.id}">${p.last}, ${p.first}</option>`).join('')}</select><div class="hint">Names are listed alphabetically by surname.</div></div><button class="btn primary">That's me</button><button type="button" class="text" onclick="showLanding()">Back</button></form>`))}
function lookup(e){e.preventDefault();let f=new FormData(e.target),p=person(f.get('memberId'));if(!p)return showLookup('Please choose your name.');remember(p.id);showRecognised(p.id)}
function showVisitor(){phone(hero(`<div class="eyebrow">First visit</div><h2>Welcome to the club!</h2><p>Tell us just enough to record your visit. You can sort membership out after you've settled in.</p><form class="stack" onsubmit="registerVisitor(event)"><div class="split"><div class="field"><label>First name</label><input name="first" required></div><div class="field"><label>Surname</label><input name="last" required></div></div><div class="field"><label>Email address</label><input name="email" type="email" required></div><div class="field"><label>Postcode</label><input name="postcode" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><div class="field"><label>CCLC membership number</label><input name="cclc" inputmode="numeric" placeholder="Leave blank if you don't have one"></div><div class="field"><label>Membership type</label><select name="ageType"><option value="adult">Adult (18+)</option><option value="child">Under 18 / child</option></select></div><div class="hint">We use these details for club administration, attendance records and membership purposes.</div><button class="btn teal">Check in</button><button type="button" class="text" onclick="showLanding()">Back</button></form>`))}
function registerVisitor(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),p=people.find(x=>email&&x.email===email);if(!p){let mt=f.get('ageType')==='child'?'child':'visitor';p={id:'ccbgc-'+String(Date.now()),first:f.get('first').trim(),last:f.get('last').trim(),email,postcode:f.get('postcode').trim(),cclc:f.get('cclc').trim(),memberType:mt,paid2526:false,paid2627:false,payment2526:'',note:mt==='child'?'Child member':''};people.push(p);save()}remember(p.id);doCheck(p.id)}
function doCheck(id){checkIn(id);showSuccess(id)}
function showSuccess(id){let p=person(id),a=has(id),s=membershipState(p);phone(`<section class="card success"><div class="check">✓</div><div class="eyebrow">Checked in</div><h1>You're all set, ${p.first}.</h1><div class="meta" style="justify-content:center">${pill(p)}</div><p>${niceDate()}<br><b>${niceTime(a.time)}</b></p>${membershipMessage(p)}${s==='visitor'?`<div class="notice" style="margin-top:12px">Please say hello to a committee member if you'd like to join.</div><p><button class="btn coral" onclick="simulateSquare('${id}')">Join / Pay membership</button></p>`:''}${s==='due'?`<p><button class="btn coral" onclick="simulateSquare('${id}')">Renew 2026/27 membership</button></p>`:''}<p>Have a brilliant game day 🎲</p><button class="text" onclick="undo('${a.id}','${id}')">Undo check-in</button></section>`)}
function undo(aid,id){att=att.filter(a=>a.id!==aid);save();showRecognised(id)}
function updateCCLC(id){let p=person(id),v=prompt('Enter your Central Coast Leagues Club membership number:','');if(v!==null&&v.trim()){p.cclc=v.trim();save();showRecognised(id)}}
function simulateSquare(id){let p=person(id);if(!confirm('TEST MODE: simulate a successful Square payment for 2026/27?'))return;p.memberType='adult';p.paid2627=true;p.note='26/27 paid via simulated Square checkout';save();alert('Test payment successful. The member record has been updated automatically.');showRecognised(id)}
const tabs={today:'Today',history:'Attendance',people:'People',raffle:'Raffle',settings:'Settings'};
function showAdmin(tab='today'){root.innerHTML=`<div class="admin"><aside class="side"><h3>Committee</h3>${Object.keys(tabs).map(x=>`<button class="nav ${x===tab?'active':''}" onclick="showAdmin('${x}')">${tabs[x]}</button>`).join('')}<button class="nav" onclick="showLanding()">← Check-in view</button></aside><section id="panel"></section></div>`;renderAdmin(tab)}
function renderAdmin(t){if(t==='today')renderToday();if(t==='history')renderHistory();if(t==='people')renderPeople();if(t==='raffle')renderRaffle();if(t==='settings')renderSettings()}
function renderToday(){let rows=today(),m=rows.filter(a=>membershipState(person(a.personId))!=='visitor').length;panel.innerHTML=`<div class="panel"><div class="toolbar"><div><div class="eyebrow">Today's session</div><h2>${niceDate()}</h2></div><button class="btn primary mini" onclick="openManual()">+ Check someone in</button></div><div class="stats"><div class="stat"><span>Checked in</span><b>${rows.length}</b></div><div class="stat"><span>Members</span><b>${m}</b></div><div class="stat"><span>Visitors</span><b>${rows.length-m}</b></div></div><div class="toolbar"><input id="q" class="search" placeholder="Search attendees" oninput="filterRows()"><button class="btn soft mini" onclick="exportCSV()">Export CSV</button></div><div id="attTable">${attTable(rows)}</div></div>`}
function attTable(rows){if(!rows.length)return `<div class="empty">No one is checked in yet.</div>`;return `<table><thead><tr><th>Name</th><th>Status</th><th>Arrival</th><th class="hide-mobile">CCLC</th><th></th></tr></thead><tbody>${rows.map(a=>{let p=person(a.personId);return `<tr data-name="${(p.first+' '+p.last).toLowerCase()}"><td><b>${p.first} ${p.last}</b></td><td>${pill(p)}</td><td>${niceTime(a.time)}</td><td class="hide-mobile">${p.cclc||'—'}</td><td><button class="btn soft mini" onclick="removeAtt('${a.id}')">Remove</button></td></tr>`}).join('')}</tbody></table>`}
function filterRows(){let s=q.value.toLowerCase();document.querySelectorAll('#attTable tbody tr').forEach(r=>r.style.display=r.dataset.name.includes(s)?'':'none')}function removeAtt(id){att=att.filter(a=>a.id!==id);save();renderToday()}
function openManual(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="toolbar"><div><div class="eyebrow">Manual check-in</div><h2>Find someone</h2></div><button class="text" onclick="modal.remove()">Close</button></div><input id="mq" class="search" style="width:100%" placeholder="Start typing a name" oninput="manualResults()"><div id="mr"></div></div></div>`);manualResults()}
function manualResults(){let s=(mq.value||'').toLowerCase(),r=people.filter(p=>(p.first+' '+p.last+' '+p.email+' '+p.cclc).toLowerCase().includes(s)).slice(0,10);mr.innerHTML=r.map(p=>`<div class="toolbar" style="padding:10px 0;border-bottom:1px solid #eee"><div><b>${p.first} ${p.last}</b><br><span class="hint">${stateLabel(p)}${p.cclc?' · CCLC '+p.cclc:''}</span></div>${has(p.id)?'<span class="pill member">Checked in</span>':`<button class="btn teal mini" onclick="manualCheck('${p.id}')">Check in</button>`}</div>`).join('')}function manualCheck(id){checkIn(id,'manual');modal.remove();renderToday()}
function renderHistory(){let g={};att.forEach(a=>(g[a.date]??=[]).push(a));let dates=Object.keys(g).sort().reverse();panel.innerHTML=`<div class="panel"><div class="eyebrow">Attendance history</div><h2>Past sessions</h2>${dates.length?dates.map(d=>`<div style="padding:14px 0;border-bottom:1px solid #eee"><b>${new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}</b><div class="hint">${g[d].length} attendees</div></div>`).join(''):'<div class="empty">Attendance history will appear here.</div>'}</div>`}
function renderPeople(){let s=document.getElementById('peopleSearch')?.value?.toLowerCase()||'',list=people.filter(p=>(p.first+' '+p.last+' '+p.email+' '+p.cclc).toLowerCase().includes(s)).sort((a,b)=>a.last.localeCompare(b.last)||a.first.localeCompare(b.first));panel.innerHTML=`<div class="panel"><div class="toolbar"><div><div class="eyebrow">Membership database</div><h2>${people.length} people</h2></div><input id="peopleSearch" class="search" placeholder="Search name, email or CCLC" value="${s}" oninput="renderPeople()"></div><table><thead><tr><th>Name</th><th>Status</th><th>CCLC</th><th class="hide-mobile">Email</th><th>26/27</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${p.first} ${p.last}</b><br><span class="hint">${p.id}</span></td><td>${pill(p)}</td><td>${p.cclc||'<span class="hint">Missing</span>'}</td><td class="hide-mobile">${p.email||'—'}</td><td>${p.memberType==='lifetime'?'Never due':p.memberType==='child'?'Free':p.paid2627?'Paid':'—'}</td></tr>`).join('')}</tbody></table></div>`}
function renderRaffle(){let e=today().filter(a=>membershipState(person(a.personId))!=='visitor');panel.innerHTML=`<div class="panel"><div class="eyebrow">Attendance raffle</div><h2>Draw from today's members</h2><p>Lifetime, child and paid adult members are eligible; visitors are excluded.</p><div class="notice"><b>${e.length}</b> eligible entries.</div><div id="win"></div><button class="btn coral" style="margin-top:14px" onclick="draw()" ${e.length?'':'disabled'}>🎟️ Draw winner</button></div>`}
function draw(){let e=today().filter(a=>membershipState(person(a.personId))!=='visitor'),a=e[Math.floor(Math.random()*e.length)],p=person(a.personId);win.innerHTML=`<div class="winner">🏆 ${p.first} ${p.last}</div>`}
function renderSettings(){let td=localStorage.getItem('ccbg_testdate')||'';panel.innerHTML=`<div class="panel"><div class="eyebrow">Membership settings</div><h2>Test & migration controls</h2><div class="stack"><div class="status-card"><b>Membership year rules</b><p class="hint">25/26: 26 Nov 2025 – 24 Nov 2026<br>26/27: from 25 Nov 2026</p></div><div class="field"><label>Test date override</label><input id="testdate" type="date" value="${td}"><div class="hint">Set 25/11/2026 or later to test renewal messaging now.</div></div><div class="toolbar"><button class="btn primary" onclick="setTestDate()">Apply test date</button><button class="btn soft" onclick="clearTestDate()">Use today's real date</button></div><div class="notice">Square is currently in <b>safe simulation mode</b>. No real payments are taken.</div><button class="btn soft" onclick="resetDemo()">Reset local test data from member import</button></div></div>`}
function setTestDate(){if(!testdate.value)return;localStorage.setItem('ccbg_testdate',testdate.value);renderSettings()}function clearTestDate(){localStorage.removeItem('ccbg_testdate');renderSettings()}
function resetDemo(){if(!confirm('Reset local test check-ins and member edits?'))return;localStorage.removeItem('ccbg_people_v3');localStorage.removeItem('ccbg_att_v3');localStorage.removeItem('ccbg_remembered_v3');people=structuredClone(seed);att=[];remembered=null;showAdmin('today')}
function exportCSV(){let rows=[['Date','Arrival','First name','Surname','Membership status','Email','Postcode','CCLC No','Method'],...att.map(a=>{let p=person(a.personId);return[a.date,niceTime(a.time),p.first,p.last,stateLabel(p),p.email,p.postcode,p.cclc,a.method]})],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='club-attendance.csv';x.click();URL.revokeObjectURL(u)}
showLanding();
</script></body></html>
