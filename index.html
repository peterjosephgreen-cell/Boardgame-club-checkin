const seed=[{id:'p1',first:'Alex',last:'Morgan',email:'alex@example.com',postcode:'2250',status:'member'},{id:'p2',first:'Jordan',last:'Lee',email:'jordan@example.com',postcode:'2260',status:'member'},{id:'p3',first:'Sam',last:'Patel',email:'sam@example.com',postcode:'2251',status:'member'},{id:'p4',first:'Casey',last:'Nguyen',email:'casey@example.com',postcode:'2257',status:'visitor'},{id:'p5',first:'Taylor',last:'Brooks',email:'taylor@example.com',postcode:'2250',status:'member'}];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let people=load('ccbg_people',seed),att=load('ccbg_att',[]),remembered=localStorage.getItem('ccbg_remembered');const save=()=>{localStorage.setItem('ccbg_people',JSON.stringify(people));localStorage.setItem('ccbg_att',JSON.stringify(att))};const day=()=>new Date().toLocaleDateString('en-CA');const niceDate=()=>new Intl.DateTimeFormat('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());const niceTime=i=>new Intl.DateTimeFormat('en-AU',{hour:'numeric',minute:'2-digit'}).format(new Date(i));const person=id=>people.find(p=>p.id===id);const today=()=>att.filter(a=>a.date===day());const has=id=>today().find(a=>a.personId===id);function checkIn(id,method='qr'){let a=has(id);if(a)return a;a={id:'a'+Date.now(),personId:id,date:day(),time:new Date().toISOString(),method};att.unshift(a);save();return a}function remember(id){remembered=id;localStorage.setItem('ccbg_remembered',id)}function phone(x){root.innerHTML=`<div class="phone">${x}</div>`}function hero(x){return `<section class="card hero"><img src="${LOGO}" alt="Central Coast Board Games logo"><div class="pad">${x}</div></section>`}
function showLanding(){let p=person(remembered);if(p)return showRecognised(p.id);phone(hero(`<div class="eyebrow">Welcome</div><h1>Game day starts here.</h1><p>Scan, check in, grab a game and settle in. It only takes a few seconds.</p><div class="stack"><button class="btn primary" onclick="showLookup()">Yes — I'm a member</button><button class="btn teal" onclick="showVisitor()">I'm new here</button></div><div class="demo"><b>Prototype shortcut:</b> <button class="text" onclick="remember('p1');showRecognised('p1')">simulate a recognised member</button></div>`))}
function showRecognised(id){let p=person(id),a=has(id);phone(hero(`<div class="eyebrow">${p.status==='member'?'Welcome back':'Hello again'}</div><h1>Hi, ${p.first} 👋</h1>${a?`<div class="notice">✅ You're already checked in today at <b>${niceTime(a.time)}</b>.</div>`:`<p>Ready to check in for today's board game session?</p>`}<div class="stack">${a?`<button class="btn teal" onclick="showSuccess('${id}')">View check-in</button>`:`<button class="btn primary" onclick="doCheck('${id}')">Check me in</button>`}${p.status==='visitor'?`<button class="btn soft" onclick="alert('Membership payment link will be connected here.')">Become a member</button>`:''}<button class="text" onclick="switchPerson()">Not ${p.first}? Switch person</button></div>`))}
function switchPerson(){localStorage.removeItem('ccbg_remembered');remembered=null;showLanding()}
function showLookup(msg=''){let members=people.filter(p=>p.status==='member').sort((a,b)=>a.last.localeCompare(b.last)||a.first.localeCompare(b.first));phone(hero(`<div class="eyebrow">Member check-in</div><h2>Find your membership</h2><p>Select your name from the member list below.</p>${msg?`<div class="notice">${msg}</div>`:''}<form class="stack" onsubmit="lookup(event)"><div class="field"><label>Select your name</label><select name="memberId" required><option value="">Choose your name…</option>${members.map(p=>`<option value="${p.id}">${p.last}, ${p.first}</option>`).join('')}</select><div class="hint">Names are listed alphabetically by surname. Your email address is not displayed.</div></div><button class="btn primary">That's me</button><button type="button" class="text" onclick="showLanding()">Back</button></form>`))}
function lookup(e){e.preventDefault();let f=new FormData(e.target),p=people.find(x=>x.id===f.get('memberId')&&x.status==='member');if(!p)return showLookup('Please choose your name from the member list.');remember(p.id);showRecognised(p.id)}
function showVisitor(){phone(hero(`<div class="eyebrow">First visit</div><h2>Welcome to the club!</h2><p>Tell us just enough to record your visit. You can sort membership out after you've settled in.</p><form class="stack" onsubmit="registerVisitor(event)"><div class="field"><label>First name</label><input name="first" required></div><div class="field"><label>Surname</label><input name="last" required></div><div class="field"><label>Email address</label><input name="email" type="email" required></div><div class="field"><label>Postcode</label><input name="postcode" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><div class="hint">We use these details for club administration, attendance records and membership purposes.</div><button class="btn teal">Check in as a visitor</button><button type="button" class="text" onclick="showLanding()">Back</button></form>`))}
function registerVisitor(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),p=people.find(x=>x.email.toLowerCase()===email);if(!p){p={id:'p'+Date.now(),first:f.get('first').trim(),last:f.get('last').trim(),email,postcode:f.get('postcode').trim(),status:'visitor'};people.push(p);save()}remember(p.id);doCheck(p.id)}function doCheck(id){checkIn(id);showSuccess(id)}function showSuccess(id){let p=person(id),a=has(id);phone(`<section class="card success"><div class="check">✓</div><div class="eyebrow">Checked in</div><h1>You're all set, ${p.first}.</h1><p>${niceDate()}<br><b>${niceTime(a.time)}</b></p>${p.status==='visitor'?`<div class="notice">Please say hello to a committee member if you'd like to join, or use the membership payment link when you're ready.</div><p><button class="btn coral" onclick="alert('Membership payment link will be connected here.')">Join / Pay membership</button></p>`:''}<p>Have a brilliant game day 🎲</p><button class="text" onclick="undo('${a.id}','${id}')">Undo check-in</button></section>`)}function undo(aid,id){att=att.filter(a=>a.id!==aid);save();showRecognised(id)}
const tabs={today:'Today',history:'Attendance',people:'People',raffle:'Raffle',settings:'Settings'};function showAdmin(tab='today'){root.innerHTML=`<div class="admin"><aside class="side"><h3>Committee</h3>${Object.keys(tabs).map(x=>`<button class="nav ${x===tab?'active':''}" onclick="showAdmin('${x}')">${tabs[x]}</button>`).join('')}<button class="nav" onclick="showLanding()">← Check-in view</button></aside><section id="panel"></section></div>`;renderAdmin(tab)}function renderAdmin(t){if(t==='today')renderToday();if(t==='history')renderHistory();if(t==='people')renderPeople();if(t==='raffle')renderRaffle();if(t==='settings')renderSettings()}
function renderToday(){let rows=today(),m=rows.filter(a=>person(a.personId)?.status==='member').length;panel.innerHTML=`<div class="panel"><div class="toolbar"><div><div class="eyebrow">Today's session</div><h2>${niceDate()}</h2></div><button class="btn primary mini" onclick="openManual()">+ Check someone in</button></div><div class="stats"><div class="stat"><span>Checked in</span><b>${rows.length}</b></div><div class="stat"><span>Members</span><b>${m}</b></div><div class="stat"><span>Visitors</span><b>${rows.length-m}</b></div></div><div class="toolbar"><input id="q" class="search" placeholder="Search attendees" oninput="filterRows()"><button class="btn soft mini" onclick="exportCSV()">Export CSV</button></div><div id="attTable">${attTable(rows)}</div></div>`}function attTable(rows){if(!rows.length)return `<div class="empty">No one is checked in yet.</div>`;return `<table><thead><tr><th>Name</th><th>Status</th><th>Arrival</th><th class="hide-mobile">Method</th><th></th></tr></thead><tbody>${rows.map(a=>{let p=person(a.personId);return `<tr data-name="${(p.first+' '+p.last).toLowerCase()}"><td><b>${p.first} ${p.last}</b></td><td><span class="pill ${p.status}">${p.status==='member'?'Member':'Visitor'}</span></td><td>${niceTime(a.time)}</td><td class="hide-mobile">${a.method==='manual'?'Committee':'QR'}</td><td><button class="btn soft mini" onclick="removeAtt('${a.id}')">Remove</button></td></tr>`}).join('')}</tbody></table>`}function filterRows(){let s=q.value.toLowerCase();document.querySelectorAll('#attTable tbody tr').forEach(r=>r.style.display=r.dataset.name.includes(s)?'':'none')}function removeAtt(id){att=att.filter(a=>a.id!==id);save();renderToday()}
function openManual(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="toolbar"><div><div class="eyebrow">Manual check-in</div><h2>Find someone</h2></div><button class="text" onclick="modal.remove()">Close</button></div><input id="mq" class="search" style="width:100%" placeholder="Start typing a name" oninput="manualResults()"><div id="mr"></div></div></div>`);manualResults()}function manualResults(){let s=(mq.value||'').toLowerCase(),r=people.filter(p=>(p.first+' '+p.last+' '+p.email).toLowerCase().includes(s)).slice(0,8);mr.innerHTML=r.map(p=>`<div class="toolbar" style="padding:10px 0;border-bottom:1px solid #eee"><div><b>${p.first} ${p.last}</b><br><span class="hint">${p.status} · ${p.email}</span></div>${has(p.id)?'<span class="pill member">Checked in</span>':`<button class="btn teal mini" onclick="manualCheck('${p.id}')">Check in</button>`}</div>`).join('')}function manualCheck(id){checkIn(id,'manual');modal.remove();renderToday()}
function renderHistory(){let g={};att.forEach(a=>(g[a.date]??=[]).push(a));let dates=Object.keys(g).sort().reverse();panel.innerHTML=`<div class="panel"><div class="eyebrow">Attendance history</div><h2>Past sessions</h2>${dates.length?dates.map(d=>`<div style="padding:14px 0;border-bottom:1px solid #eee"><b>${new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}</b><div class="hint">${g[d].length} attendees</div></div>`).join(''):'<div class="empty">Attendance history will appear here.</div>'}</div>`}
function renderPeople(){panel.innerHTML=`<div class="panel"><div class="eyebrow">People</div><h2>Members & visitors</h2><table><thead><tr><th>Name</th><th>Status</th><th>Email</th><th>Postcode</th></tr></thead><tbody>${people.map(p=>`<tr><td><b>${p.first} ${p.last}</b></td><td><span class="pill ${p.status}">${p.status==='member'?'Member':'Visitor'}</span></td><td>${p.email}</td><td>${p.postcode}</td></tr>`).join('')}</tbody></table></div>`}
function renderRaffle(){let e=today().filter(a=>person(a.personId)?.status==='member');panel.innerHTML=`<div class="panel"><div class="eyebrow">Attendance raffle</div><h2>Draw from today's members</h2><p>This prototype gives one entry per eligible member attendance today.</p><div class="notice"><b>${e.length}</b> eligible entries.</div><div id="win"></div><button class="btn coral" style="margin-top:14px" onclick="draw()" ${e.length?'':'disabled'}>🎟️ Draw winner</button></div>`}function draw(){let e=today().filter(a=>person(a.personId)?.status==='member'),a=e[Math.floor(Math.random()*e.length)],p=person(a.personId);win.innerHTML=`<div class="winner">🏆 ${p.first} ${p.last}</div>`}
function renderSettings(){panel.innerHTML=`<div class="panel"><div class="eyebrow">Prototype settings</div><h2>Club setup</h2><div class="stack"><div class="field"><label>Membership / payment link</label><input value="https://your-club-link.example/join" disabled><div class="hint">Replace with the club's real membership or payment URL.</div></div><div class="field"><label>Permanent QR destination</label><input value="Your deployed app URL /checkin" disabled></div><button class="btn soft" onclick="resetDemo()">Reset prototype data</button></div></div>`}function resetDemo(){localStorage.clear();people=structuredClone(seed);att=[];remembered=null;showAdmin('today')}function exportCSV(){let rows=[['Date','Arrival','First name','Surname','Status','Email','Postcode','Method'],...att.map(a=>{let p=person(a.personId);return[a.date,niceTime(a.time),p.first,p.last,p.status,p.email,p.postcode,a.method]})],csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='club-attendance.csv';x.click();URL.revokeObjectURL(u)}showLanding();
</script></body></html>
