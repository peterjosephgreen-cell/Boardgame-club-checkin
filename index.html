<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Coast Board Games — Check In</title>
<script src="firebase-config.js"></script>
<style>
:root{--ink:#2b282c;--cream:#fff8ec;--blue:#3f7fbf;--orange:#ff9c1a;--line:#eadfce;--muted:#746e6f;--shadow:0 16px 36px rgba(54,42,34,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at top left,#fff1d8,#fff8ec 38%,#f4efe8);color:var(--ink);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#2d2a2f;color:#fff}.brand{font-weight:900}.adminlink{border:1px solid #ffffff44;background:#ffffff0c;color:#fff;border-radius:999px;padding:8px 12px}.shell{max-width:1080px;margin:auto;padding:24px 16px 48px}.phone{max-width:480px;margin:auto}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}.hero{overflow:hidden}.logo{padding:26px 22px 6px;text-align:center;font-size:1.35rem;font-weight:950}.pad,.panel{padding:22px}.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.78rem;font-weight:950;color:var(--orange)}h1,h2{line-height:1.08;margin:.25em 0 .5em}h1{font-size:clamp(2rem,8vw,3.2rem)}p{line-height:1.55;color:#514d4e}.stack{display:grid;gap:12px}.btn{border:0;border-radius:16px;padding:14px 18px;min-height:52px;font-weight:900}.primary{background:var(--orange);color:#2a2420}.blue{background:var(--blue);color:white}.soft{background:#f6efe6;color:var(--ink);border:1px solid var(--line)}.text{border:0;background:none;color:var(--blue);font-weight:850;padding:6px}.field{display:grid;gap:6px}.field label{font-weight:850}.field input,.field select,.search{border:1.5px solid #d7cbbb;border-radius:14px;padding:13px 14px;outline:none;width:100%}.field input:focus,.field select:focus,.search:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff9c1a22}.hint{font-size:.84rem;color:var(--muted)}.notice{padding:12px 14px;border-radius:14px;background:#fff5dd;border:1px solid #f3d59a}.warning{background:#edf5fd;border-color:#a9c8e7}.success{text-align:center;padding:24px}.check{width:82px;height:82px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:#fff0d5;color:#a45b00;font-size:2.5rem}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.8rem;font-weight:900}.member,.lifetime,.child,.prepaid{background:#fff0d5;color:#a45b00}.visitor,.due{background:#e6f0fb;color:#245f99}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.admin{display:grid;grid-template-columns:210px 1fr;gap:18px}.side{background:#2d2a2f;color:#fff;padding:16px;border-radius:24px;align-self:start;position:sticky;top:78px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#e9e4e6;padding:11px;border-radius:12px;font-weight:850}.nav.active,.nav:hover{background:#ffffff16}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{padding:18px;background:#faf6ef;border:1px solid var(--line);border-radius:18px}.stat b{display:block;font-size:2rem}.mini{min-height:auto;padding:9px 11px;border-radius:10px;font-size:.84rem}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee5da}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted)}.statusdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--orange)}.statusdot.closed{background:var(--blue)}@media(max-width:760px){.admin{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side h3{display:none}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}.hide-mobile{display:none}}
</style></head><body><div class="top"><div class="brand">🎲 Central Coast Board Games Check-In</div><button class="adminlink" id="committeeBtn">Committee</button></div><main class="shell" id="root"></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,orderBy,onSnapshot,serverTimestamp,Timestamp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
const cfg=window.CLUB_FIREBASE_CONFIG; const root=document.querySelector('#root');
if(!cfg?.projectId){root.innerHTML='<div class="panel"><h2>Firebase setup required</h2><p>firebase-config.js is missing.</p></div>';throw new Error('No Firebase config');}
const app=initializeApp(cfg), auth=getAuth(app), db=getFirestore(app); let directory=[], currentUser=null, unSub=null;
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Sydney',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function prettyDate(){return new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}
function effectiveStatus(p, testDate=null){const d=testDate||new Date(); const cutoff=new Date('2026-11-25T00:00:00+11:00'); if(p.memberType==='lifetime')return 'Lifetime member'; if(p.memberType==='child')return 'Child member'; if(p.prepaid2627)return d>=cutoff?'Active 26/27':'26/27 prepaid'; if(d>=cutoff)return 'Renewal due'; return 'Active member'}
async function loadDirectory(){const snap=await getDocs(collection(db,'publicMembers'));directory=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.displayName.localeCompare(b.displayName));}
async function getSession(){const d=await getDoc(doc(db,'sessions',dateKey()));return d.exists()?d.data():{isOpen:false};}
function wrap(x){root.innerHTML='<div class="phone">'+x+'</div>'}
async function home(){await loadDirectory(); const s=await getSession(); const remembered=localStorage.getItem('ccbg_person'); const p=directory.find(x=>x.id===remembered); wrap(`<section class="card hero"><div class="logo">🎲 Central Coast Board Games</div><div class="pad"><div class="eyebrow">Club check-in</div><h1>${s.isOpen?'Welcome!':'Check-in is currently closed'}</h1><p>${s.isOpen?'Scan, choose your name and you’re in.':'A committee member will open today’s session when check-in begins.'}</p>${p&&s.isOpen?`<div class="notice"><b>Welcome back, ${esc(p.displayName.split(' ')[0])}.</b><br><span class="hint">This device remembers you.</span></div><div class="stack" style="margin-top:14px"><button class="btn primary" id="remembered">Check me in</button><button class="text" id="switch">Not ${esc(p.displayName.split(' ')[0])}? Switch person</button></div>`:s.isOpen?`<div class="stack"><button class="btn primary" id="member">I’m a member</button><button class="btn blue" id="visitor">I’m new / not a member</button></div>`:''}</div></section>`); if($('#member'))$('#member').onclick=memberSelect;if($('#visitor'))$('#visitor').onclick=visitorForm;if($('#remembered'))$('#remembered').onclick=()=>checkMember(p);if($('#switch'))$('#switch').onclick=()=>{localStorage.removeItem('ccbg_person');memberSelect()}}
function memberSelect(){wrap(`<div class="panel"><div class="eyebrow">Member check-in</div><h2>Select your name</h2><div class="field"><label>Member</label><input id="search" placeholder="Type part of your name"><select id="memberList" size="8"></select></div><div id="selected" class="notice" style="display:none;margin-top:12px"></div><div class="stack" style="margin-top:14px"><button class="btn primary" id="go" disabled>That’s me — check in</button><button class="btn blue" id="back">Go back</button></div></div>`); const list=$('#memberList'),search=$('#search'); let selected=null; function render(){const q=search.value.toLowerCase();list.innerHTML=directory.filter(p=>p.displayName.toLowerCase().includes(q)).map(p=>`<option value="${p.id}">${esc(p.displayName)}</option>`).join('')}render();search.oninput=render;list.onchange=()=>{selected=directory.find(p=>p.id===list.value);$('#selected').style.display='block';$('#selected').innerHTML=`<b>${esc(selected.displayName)}</b><div class="meta"><span class="pill member">${esc(effectiveStatus(selected))}</span></div>`;$('#go').disabled=false};$('#go').onclick=()=>selected&&checkMember(selected);$('#back').onclick=home}
async function checkMember(p){const s=await getSession(); if(!s.isOpen){home();return} const id=dateKey()+'_'+p.id; try{await setDoc(doc(db,'attendance',id),{dateKey:dateKey(),personId:p.id,visitorId:'',displayName:p.displayName,personType:'member',memberType:p.memberType,checkedInAt:serverTimestamp(),source:'qr'});localStorage.setItem('ccbg_person',p.id);success(p)}catch(e){if(e.code==='permission-denied')already(p);else alert(e.message)}}
function already(p){wrap(`<div class="panel success"><div class="check">✓</div><h2>You’re already checked in</h2><p>${esc(p.displayName)} already has an attendance record for today.</p><button class="btn blue" id="back">Go back</button></div>`);$('#back').onclick=home}
function success(p){const st=effectiveStatus(p);const due=st==='Renewal due';wrap(`<div class="panel success"><div class="check">✓</div><h2>You’re checked in!</h2><p><b>${esc(p.displayName)}</b><br>${prettyDate()}</p><div class="meta" style="justify-content:center"><span class="pill ${due?'due':'member'}">${esc(st)}</span></div>${p.prepaid2627?'<div class="notice">Your 2026/27 membership is already paid — nothing further is required when renewals open.</div>':''}${due?'<div class="notice warning">Your 2026/27 club membership is due for renewal. You can still enjoy today’s session.</div>':''}${!p.hasCCLC?'<div class="notice warning" style="margin-top:12px">We don’t have a Central Coast Leagues Club number recorded for you.<div class="field" style="margin-top:8px"><input id="cclc" placeholder="CCLC number"><button class="btn blue mini" id="submitCCLC">Submit for committee update</button></div></div>':''}<button class="btn primary" id="done" style="margin-top:16px">Done</button></div>`);if($('#submitCCLC'))$('#submitCCLC').onclick=async()=>{const v=$('#cclc').value.trim();if(v){await addDoc(collection(db,'profileUpdates'),{personId:p.id,displayName:p.displayName,cclcNumber:v,createdAt:serverTimestamp(),status:'pending'});$('#submitCCLC').disabled=true;$('#submitCCLC').textContent='Submitted ✓'}};$('#done').onclick=home}
function visitorForm(){wrap(`<div class="panel"><div class="eyebrow">Welcome to the club</div><h2>Check in as a visitor</h2><div class="stack"><div class="field"><label>First name</label><input id="fn"></div><div class="field"><label>Surname</label><input id="ln"></div><div class="field"><label>Email</label><input id="em" type="email"></div><div class="field"><label>Postcode</label><input id="pc" inputmode="numeric"></div><div class="field"><label>Central Coast Leagues Club membership number</label><input id="cn"><span class="hint">Leave blank if you don’t have one yet.</span></div><div class="field"><label>Membership type</label><select id="mt"><option value="adult">Adult</option><option value="child">Under 18 / child</option></select></div><div class="notice warning hint">We use these details only for club administration, attendance records and membership purposes. Central Coast Board Games will not sell your personal data or share it for marketing purposes.</div><button class="btn primary" id="reg">Check in</button><button class="btn blue" id="back">Go back</button></div></div>`);$('#back').onclick=home;$('#reg').onclick=registerVisitor}
async function registerVisitor(){const first=$('#fn').value.trim(),last=$('#ln').value.trim(),email=$('#em').value.trim(),postcode=$('#pc').value.trim();if(!first||!email){alert('Please enter at least your first name and email address.');return}const s=await getSession();if(!s.isOpen){home();return}const vr=await addDoc(collection(db,'visitorRegistrations'),{firstName:first,lastName:last,email,postcode,cclcNumber:$('#cn').value.trim(),memberType:$('#mt').value,createdAt:serverTimestamp()});const display=(first+' '+last).trim();try{await setDoc(doc(db,'attendance',dateKey()+'_visitor_'+vr.id),{dateKey:dateKey(),personId:'',visitorId:vr.id,displayName:display,personType:'visitor',memberType:$('#mt').value,checkedInAt:serverTimestamp(),source:'qr'});localStorage.setItem('ccbg_visitor',vr.id);wrap(`<div class="panel success"><div class="check">✓</div><h2>You’re checked in!</h2><p>Welcome, <b>${esc(first)}</b>.</p><div class="notice warning">Please speak to a committee member about joining the club.</div><button class="btn primary" id="done">Done</button></div>`);$('#done').onclick=home}catch(e){alert(e.message)}}
async function committee(){if(currentUser)return dashboard();wrap(`<div class="phone"><div class="panel"><div class="eyebrow">Committee</div><h2>Sign in</h2><p>Committee access is protected by Firebase Authentication.</p><div class="stack"><div class="field"><label>Email</label><input id="ae" type="email"></div><div class="field"><label>Password</label><input id="ap" type="password"></div><button class="btn primary" id="signin">Sign in</button><button class="btn blue" id="back">Go back</button></div><p class="hint" id="err"></p></div></div>`);$('#back').onclick=home;$('#signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#ae').value,$('#ap').value)}catch(e){$('#err').textContent=e.message}}}
function nav(label,id){return `<button class="nav ${id==='dash'?'active':''}" data-view="${id}">${label}</button>`}
async function dashboard(){if(unSub){unSub();unSub=null}root.innerHTML=`<div class="admin"><aside class="side"><h3>Committee</h3>${nav('Today','dash')}${nav('Members','members')}${nav('Updates','updates')}<button class="nav" id="logout">Sign out</button></aside><section class="panel" id="adminMain">Loading…</section></div>`;$('#logout').onclick=()=>signOut(auth);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>adminView(b.dataset.view));adminView('dash')}
async function adminView(v){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(v==='members')return membersView();if(v==='updates')return updatesView();return todayView()}
async function todayView(){const main=$('#adminMain'),key=dateKey();const sref=doc(db,'sessions',key);const ss=await getDoc(sref);const open=ss.exists()&&ss.data().isOpen;main.innerHTML=`<div class="toolbar"><div><div class="eyebrow">${prettyDate()}</div><h2>Today’s attendance</h2><p><span class="statusdot ${open?'':'closed'}"></span>${open?'Check-in open':'Check-in closed'}</p></div><button class="btn ${open?'blue':'primary'} mini" id="toggle">${open?'Close check-in':'Open check-in'}</button></div><div class="stats"><div class="stat"><span>Checked in</span><b id="tot">0</b></div><div class="stat"><span>Members</span><b id="mem">0</b></div><div class="stat"><span>Visitors</span><b id="vis">0</b></div></div><div id="att"></div>`;$('#toggle').onclick=async()=>{await setDoc(sref,{dateKey:key,isOpen:!open,updatedAt:serverTimestamp(),openedBy:currentUser.email},{merge:true});todayView()};const q=query(collection(db,'attendance'),where('dateKey','==',key));if(unSub)unSub();unSub=onSnapshot(q,snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.checkedInAt?.seconds||0)-(b.checkedInAt?.seconds||0));$('#tot').textContent=rows.length;$('#mem').textContent=rows.filter(x=>x.personType==='member').length;$('#vis').textContent=rows.filter(x=>x.personType==='visitor').length;$('#att').innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>Status</th><th>Arrival</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.displayName)}</td><td><span class="pill ${x.personType==='member'?'member':'visitor'}">${x.personType}</span></td><td>${x.checkedInAt?new Date(x.checkedInAt.seconds*1000).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}):'Just now'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nobody has checked in yet.</div>'})}
async function membersView(){const main=$('#adminMain');const [ps,ms]=await Promise.all([getDocs(collection(db,'people')),getDocs(collection(db,'memberships'))]);const memMap={};ms.forEach(d=>(memMap[d.data().personId]??=[]).push(d.data()));const rows=ps.docs.map(d=>({id:d.id,...d.data(),memberships:memMap[d.id]||[]})).sort((a,b)=>a.displayName.localeCompare(b.displayName));main.innerHTML=`<div class="toolbar"><div><div class="eyebrow">Private database</div><h2>Members</h2></div><input class="search" id="msearch" placeholder="Search members" style="max-width:300px"></div><div id="mtable"></div>`;function render(){const q=$('#msearch').value.toLowerCase();const f=rows.filter(x=>x.displayName.toLowerCase().includes(q));$('#mtable').innerHTML=`<table><thead><tr><th>Name</th><th>Type</th><th>CCLC</th><th>Email</th></tr></thead><tbody>${f.map(x=>`<tr><td>${esc(x.displayName)}</td><td><span class="pill member">${esc(x.memberType)}</span></td><td>${esc(x.cclcNumber||'—')}</td><td>${esc(x.email||'—')}</td></tr>`).join('')}</tbody></table>`}render();$('#msearch').oninput=render}
async function updatesView(){const main=$('#adminMain');const q=query(collection(db,'profileUpdates'),where('status','==','pending'));const s=await getDocs(q);const rows=s.docs.map(d=>({id:d.id,...d.data()}));main.innerHTML=`<div class="eyebrow">Member-submitted changes</div><h2>Pending updates</h2>${rows.length?rows.map(x=>`<div class="notice warning" style="margin:10px 0"><b>${esc(x.displayName)}</b><br>CCLC: ${esc(x.cclcNumber)}<div style="margin-top:8px"><button class="btn primary mini approve" data-id="${x.id}" data-p="${x.personId}" data-c="${esc(x.cclcNumber)}">Approve</button></div></div>`).join(''):'<div class="empty">No pending updates.</div>'}`;document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'people',b.dataset.p),{cclcNumber:b.dataset.c,updatedAt:serverTimestamp()});await updateDoc(doc(db,'publicMembers',b.dataset.p),{hasCCLC:true});await updateDoc(doc(db,'profileUpdates',b.dataset.id),{status:'approved'});updatesView()})}
document.querySelector('#committeeBtn').onclick=committee;onAuthStateChanged(auth,u=>{currentUser=u;if(!u&&root.querySelector?.('.admin'))home();else if(u&&root.textContent.includes('Sign in'))dashboard()});home().catch(e=>{root.innerHTML=`<div class="panel"><h2>Connection problem</h2><p>${esc(e.message)}</p><p class="hint">Check Firestore rules and that the member import has been completed.</p></div>`});
</script></body></html>
