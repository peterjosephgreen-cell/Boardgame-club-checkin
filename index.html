<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central Coast Board Games — Check In</title>
<script src="firebase-config.js"></script>
<style>
:root{--ink:#2b282c;--cream:#fff8ec;--blue:#3f7fbf;--orange:#ff9c1a;--line:#eadfce;--muted:#746e6f;--shadow:0 16px 36px rgba(54,42,34,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at top left,#fff1d8,#fff8ec 38%,#f4efe8);color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#2d2a2f;color:#fff}.brand{font-weight:900}.adminlink{border:1px solid #ffffff44;background:#ffffff0c;color:#fff;border-radius:999px;padding:8px 12px}.shell{max-width:1180px;margin:auto;padding:24px 16px 48px}.phone{max-width:480px;margin:auto}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}.hero{overflow:hidden}.logo{padding:26px 22px 6px;text-align:center;font-size:1.35rem;font-weight:950}.pad,.panel{padding:22px}.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.78rem;font-weight:950;color:var(--orange)}h1,h2,h3{line-height:1.08;margin:.25em 0 .5em}h1{font-size:clamp(2rem,8vw,3.2rem)}p{line-height:1.55;color:#514d4e}.stack{display:grid;gap:12px}.btn{border:0;border-radius:16px;padding:14px 18px;min-height:52px;font-weight:900}.primary{background:var(--orange);color:#2a2420}.blue{background:var(--blue);color:white}.soft{background:#f6efe6;color:var(--ink);border:1px solid var(--line)}.text{border:0;background:none;color:var(--blue);font-weight:850;padding:6px}.field{display:grid;gap:6px}.field label{font-weight:850}.field input,.field select,.field textarea,.search{border:1.5px solid #d7cbbb;border-radius:14px;padding:13px 14px;outline:none;width:100%;background:#fff}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff9c1a22}.hint{font-size:.84rem;color:var(--muted)}.notice{padding:12px 14px;border-radius:14px;background:#fff5dd;border:1px solid #f3d59a}.warning{background:#edf5fd;border-color:#a9c8e7}.success{text-align:center;padding:24px}.check{width:82px;height:82px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:#fff0d5;color:#a45b00;font-size:2.5rem}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.78rem;font-weight:900}.member,.lifetime,.child,.prepaid,.active{background:#fff0d5;color:#a45b00}.visitor,.due,.inactive{background:#e6f0fb;color:#245f99}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.admin{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}.side{background:#2d2a2f;color:#fff;padding:16px;border-radius:24px;align-self:start;position:sticky;top:78px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#e9e4e6;padding:11px;border-radius:12px;font-weight:850}.nav.active,.nav:hover{background:#ffffff16}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{padding:18px;background:#faf6ef;border:1px solid var(--line);border-radius:18px}.stat b{display:block;font-size:2rem}.mini{min-height:auto;padding:9px 11px;border-radius:10px;font-size:.84rem}.actions{display:flex;gap:6px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee5da;vertical-align:top}th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted)}.statusdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--orange)}.statusdot.closed{background:var(--blue)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.section{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.modalback{position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:center;padding:18px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:22px;box-shadow:0 30px 80px #0005}.winner{padding:28px;text-align:center;border:2px solid #f5c774;border-radius:22px;background:#fff8e8;margin:16px 0}.winner strong{font-size:2rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid var(--line);background:#faf6ef;padding:9px 12px;border-radius:999px;font-weight:850}.tab.active{background:var(--orange)}.clickrow{cursor:pointer}.clickrow:hover{background:#fffaf2}.right{text-align:right}.small{font-size:.82rem}.nowrap{white-space:nowrap}@media(max-width:850px){.admin{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side h3{display:none}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.hide-mobile{display:none}}@media(max-width:560px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}th:nth-child(n+4),td:nth-child(n+4){display:none}}

/* v5.2 public landing refresh */
.landing-home{background:#171619;border-color:#3a363c;color:#fff;box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden}
.landing-art{display:block;width:100%;aspect-ratio:16/6.2;object-fit:cover;object-position:center;border-bottom:1px solid #3b363b;background:#232027}
.landing-pad{padding:24px 22px 26px;text-align:center;background:linear-gradient(180deg,#1e1c20,#171619)}
.landing-pad h1{font-size:clamp(1.85rem,7vw,2.65rem);color:#fff8ec;margin:.2em 0 .25em}
.landing-pad>p{color:#cbc4c5;margin:0 auto 20px;max-width:390px}
.landing-choice{display:grid;gap:12px;margin-top:16px}
.choice-btn{width:100%;border-radius:18px;min-height:82px;padding:14px 18px;display:grid;grid-template-columns:46px 1fr 24px;align-items:center;text-align:left;border:1.5px solid transparent;font-weight:900}
.choice-btn .choice-icon{font-size:1.7rem;text-align:center}.choice-btn .choice-title{display:block;font-size:1.08rem}.choice-btn .choice-sub{display:block;font-size:.8rem;font-weight:650;opacity:.8;margin-top:3px}.choice-btn .choice-arrow{font-size:1.8rem;text-align:right}
.choice-member{background:linear-gradient(135deg,#ff9c1a,#f58200);color:#241a10;border-color:#ffb347}.choice-member:hover{filter:brightness(1.04)}
.choice-visitor{background:linear-gradient(135deg,#0ea98f,#12b7a0);color:#071f1b;border-color:#34d2ba}.choice-visitor:hover{filter:brightness(1.04)}
.landing-divider{display:flex;align-items:center;gap:10px;color:#8f898d;font-size:.78rem;margin:17px 0 12px}.landing-divider:before,.landing-divider:after{content:"";height:1px;background:#3d393e;flex:1}
.committee-home{width:100%;background:#2c292e;color:#eee8e3;border:1px solid #444047;border-radius:14px;min-height:50px;font-weight:850}.committee-home:hover{background:#37333a}
.landing-privacy{font-size:.73rem;color:#8f898d;line-height:1.45;margin:14px auto 0;max-width:390px}.landing-privacy strong{color:#a7a0a4}
.remember-card{background:#29252a;border:1px solid #4a4248;border-radius:16px;padding:14px;text-align:left;margin:15px 0}.remember-card b{color:#fff3df}.remember-card .hint{color:#a9a2a5}
.landing-home .text{color:#77b7ea}.landing-home .eyebrow{color:#ff9c1a}
@media(max-width:560px){.shell{padding:14px 10px 34px}.landing-pad{padding:20px 16px 22px}.landing-art{aspect-ratio:16/7.5}.choice-btn{min-height:76px;grid-template-columns:40px 1fr 20px;padding:12px 14px}}

</style>
</head>
<body><div class="top"><div class="brand">🎲 Central Coast Board Games</div><button class="adminlink" id="committeeBtn">Committee</button></div><main class="shell" id="root"></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,onSnapshot,serverTimestamp,Timestamp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
const cfg=window.CLUB_FIREBASE_CONFIG, root=document.querySelector('#root');
if(!cfg?.projectId){root.innerHTML='<div class="panel"><h2>Firebase setup required</h2><p>firebase-config.js is missing or incorrect.</p></div>';throw new Error('No Firebase config');}
const app=initializeApp(cfg), auth=getAuth(app), db=getFirestore(app); let directory=[], currentUser=null, unSub=null, adminCache={people:[],memberships:[],attendance:[],visitors:[],sessions:[],raffles:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Sydney',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function prettyDate(d=new Date()){return new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}
function displayDate(k){if(!k)return '—';const [y,m,d]=k.split('-');return `${d}/${m}/${y}`}
function timestampMs(v){if(!v)return 0;if(v.seconds)return v.seconds*1000;if(v.toMillis)return v.toMillis();return new Date(v).getTime()||0}
function membershipStatus(person,memberships=[],when=new Date()){
  if(person.memberType==='lifetime') return {key:'lifetime',label:'Lifetime member'};
  if(person.memberType==='child') return {key:'child',label:'Child member'};
  const cutoff=new Date('2026-11-25T00:00:00+11:00');
  const has2627=memberships.some(m=>m.membershipYear==='26/27'&&['paid','prepaid','active'].includes(m.status));
  if(has2627) return when>=cutoff?{key:'active',label:'Active 26/27'}:{key:'prepaid',label:'26/27 prepaid'};
  if(when>=cutoff) return {key:'due',label:'Renewal due'};
  return {key:'active',label:'Active 25/26'};
}
function effectivePublicStatus(p,when=new Date()){if(p.memberType==='lifetime')return 'Lifetime member';if(p.memberType==='child')return 'Child member';if(p.prepaid2627)return when>=new Date('2026-11-25T00:00:00+11:00')?'Active 26/27':'26/27 prepaid';if(when>=new Date('2026-11-25T00:00:00+11:00'))return 'Renewal due';return 'Active member'}
async function loadDirectory(){const snap=await getDocs(collection(db,'publicMembers'));directory=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.displayName.localeCompare(b.displayName));}
async function getSession(){const d=await getDoc(doc(db,'sessions',dateKey()));return d.exists()?d.data():{isOpen:false};}
function wrap(x){root.innerHTML='<div class="phone">'+x+'</div>'}
async function home(){await loadDirectory();const s=await getSession(),remembered=localStorage.getItem('ccbg_person'),p=directory.find(x=>x.id===remembered);wrap(`<section class="card landing-home"><img class="landing-art" src="logo.jpg" alt="Central Coast Leagues Club Board Games"><div class="landing-pad"><div class="eyebrow">Club check-in</div><h1>${s.isOpen?'Welcome to CCLC Board Games':'Check-in is currently closed'}</h1><p>${s.isOpen?'Check in for game night, view your membership and join the fun!':'A committee member will open today’s session when check-in begins.'}</p>${p&&s.isOpen?`<div class="remember-card"><b>Welcome back, ${esc(p.displayName.split(' ')[0])}.</b><br><span class="hint">This device remembers you.</span></div><div class="landing-choice"><button class="choice-btn choice-member" id="remembered"><span class="choice-icon">👤</span><span><span class="choice-title">Check me in</span><span class="choice-sub">Continue as ${esc(p.displayName)}</span></span><span class="choice-arrow">›</span></button><button class="text" id="switch">Not ${esc(p.displayName.split(' ')[0])}? Switch person</button></div>`:s.isOpen?`<div class="landing-choice"><button class="choice-btn choice-member" id="member"><span class="choice-icon">👤</span><span><span class="choice-title">I’m a Member</span><span class="choice-sub">Check in using your name</span></span><span class="choice-arrow">›</span></button><button class="choice-btn choice-visitor" id="visitor"><span class="choice-icon">👤＋</span><span><span class="choice-title">I’m a Visitor</span><span class="choice-sub">Check in as a visitor</span></span><span class="choice-arrow">›</span></button></div>`:''}<div class="landing-divider">Committee / Admin</div><button class="committee-home" id="committeeHome">🔒 &nbsp; Committee Sign In</button><p class="landing-privacy">We use personal information only for club administration, attendance and membership. <strong>Central Coast Board Games will never sell your personal data.</strong></p></div></section>`);if($('#member'))$('#member').onclick=memberSelect;if($('#visitor'))$('#visitor').onclick=visitorForm;if($('#remembered'))$('#remembered').onclick=()=>checkMember(p);if($('#switch'))$('#switch').onclick=()=>{localStorage.removeItem('ccbg_person');memberSelect()};if($('#committeeHome'))$('#committeeHome').onclick=committee}
function memberSelect(){wrap(`<div class="panel"><div class="eyebrow">Member check-in</div><h2>Select your name</h2><div class="field"><label>Member</label><input id="search" placeholder="Type part of your name"><select id="memberList" size="8"></select></div><div id="selected" class="notice" style="display:none;margin-top:12px"></div><div class="stack" style="margin-top:14px"><button class="btn primary" id="go" disabled>That’s me — check in</button><button class="btn blue" id="back">Go back</button></div></div>`);const list=$('#memberList'),search=$('#search');let selected=null;function render(){const q=search.value.toLowerCase();list.innerHTML=directory.filter(p=>p.displayName.toLowerCase().includes(q)).map(p=>`<option value="${p.id}">${esc(p.displayName)}</option>`).join('')}render();search.oninput=render;list.onchange=()=>{selected=directory.find(p=>p.id===list.value);$('#selected').style.display='block';$('#selected').innerHTML=`<b>${esc(selected.displayName)}</b><div class="meta"><span class="pill member">${esc(effectivePublicStatus(selected))}</span></div>`;$('#go').disabled=false};$('#go').onclick=()=>selected&&checkMember(selected);$('#back').onclick=home}
async function checkMember(p){const s=await getSession();if(!s.isOpen){home();return}const id=dateKey()+'_'+p.id;try{await setDoc(doc(db,'attendance',id),{dateKey:dateKey(),personId:p.id,visitorId:'',displayName:p.displayName,personType:'member',memberType:p.memberType,checkedInAt:serverTimestamp(),source:'qr'});localStorage.setItem('ccbg_person',p.id);success(p)}catch(e){if(e?.code==='permission-denied'||String(e?.message||'').toLowerCase().includes('insufficient permissions')){already(p);return}alert(e.message)}}
function already(p){wrap(`<div class="panel success"><div class="check">✓</div><h2>You’re already checked in</h2><p>${esc(p.displayName)} already has an attendance record for today.</p><button class="btn blue" id="back">Go back</button></div>`);$('#back').onclick=home}
function success(p){const st=effectivePublicStatus(p),due=st==='Renewal due';wrap(`<div class="panel success"><div class="check">✓</div><h2>You’re checked in!</h2><p><b>${esc(p.displayName)}</b><br>${prettyDate()}</p><div class="meta" style="justify-content:center"><span class="pill ${due?'due':'member'}">${esc(st)}</span></div>${p.prepaid2627?'<div class="notice">Your 2026/27 membership is already paid. There is nothing you need to do when renewals open.</div>':''}${due?'<div class="notice warning">Your 2026/27 membership is due for renewal. You can still attend today.</div>':''}${!p.hasCCLC?'<div class="section"><p><b>Help us complete your record</b></p><div class="field"><label>CCLC membership number</label><input id="cclc"><span class="hint">Optional — this goes to committee for approval.</span></div><button class="btn primary mini" id="sendCCLC" style="margin-top:8px">Send update</button></div>':''}<button class="btn blue" id="done" style="margin-top:16px">Done</button></div>`);if($('#sendCCLC'))$('#sendCCLC').onclick=async()=>{const val=$('#cclc').value.trim();if(!val)return;await addDoc(collection(db,'profileUpdates'),{personId:p.id,displayName:p.displayName,cclcNumber:val,createdAt:serverTimestamp(),status:'pending'});$('#sendCCLC').textContent='Sent ✓';$('#sendCCLC').disabled=true};$('#done').onclick=home}
function visitorForm(){wrap(`<div class="panel"><div class="eyebrow">Welcome to the club</div><h2>New visitor check-in</h2><div class="stack"><div class="grid2"><div class="field"><label>First name</label><input id="vf"></div><div class="field"><label>Surname</label><input id="vl"></div></div><div class="field"><label>Email</label><input id="ve" type="email"></div><div class="field"><label>Postcode</label><input id="vp" inputmode="numeric"></div><div class="field"><label>CCLC membership number</label><input id="vc"><span class="hint">Leave blank if you don't have one yet.</span></div><div class="field"><label>Member type</label><select id="vt"><option value="adult">Adult</option><option value="child">Under 18 / child</option></select></div><div class="notice warning small">We use these details only for club administration, attendance records and membership purposes. Central Coast Board Games will not sell your personal data or share it for marketing purposes.</div><button class="btn primary" id="vgo">Check in</button><button class="btn blue" id="back">Go back</button><p class="hint" id="verr"></p></div></div>`);$('#back').onclick=home;$('#vgo').onclick=registerVisitor}
async function registerVisitor(){const first=$('#vf').value.trim(),last=$('#vl').value.trim(),email=$('#ve').value.trim(),postcode=$('#vp').value.trim(),cclc=$('#vc').value.trim(),memberType=$('#vt').value;if(!first||!email){$('#verr').textContent='Please enter your first name and email address.';return}try{const v=await addDoc(collection(db,'visitorRegistrations'),{firstName:first,lastName:last,email,postcode,cclcNumber:cclc,memberType,createdAt:serverTimestamp(),converted:false});await setDoc(doc(db,'attendance',dateKey()+'_visitor_'+v.id),{dateKey:dateKey(),personId:'',visitorId:v.id,displayName:(first+' '+last).trim(),personType:'visitor',memberType,checkedInAt:serverTimestamp(),source:'qr'});wrap(`<div class="panel success"><div class="check">✓</div><h2>You’re checked in!</h2><p>Welcome, <b>${esc(first)}</b>.</p><div class="notice">Please speak to a committee member about joining the club.</div><button class="btn blue" id="done" style="margin-top:16px">Done</button></div>`);$('#done').onclick=home}catch(e){$('#verr').textContent=e.message}}
async function committee(){if(currentUser)return dashboard();wrap(`<div class="panel"><div class="eyebrow">Committee access</div><h2>Sign in</h2><div class="stack"><div class="field"><label>Email</label><input id="ae" type="email"></div><div class="field"><label>Password</label><input id="ap" type="password"></div><button class="btn primary" id="signin">Sign in</button><button class="btn blue" id="back">Go back</button></div><p class="hint" id="err"></p></div>`);$('#back').onclick=home;$('#signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#ae').value,$('#ap').value)}catch(e){$('#err').textContent=e.message}}}
function nav(label,id){return `<button class="nav" data-view="${id}">${label}</button>`}
async function dashboard(){if(unSub){unSub();unSub=null}root.innerHTML=`<div class="admin"><aside class="side"><h3>Committee</h3>${nav('Today','dash')}${nav('Attendance','attendance')}${nav('Members','members')}${nav('Renewals','renewals')}${nav('Raffles','raffles')}${nav('Updates','updates')}<button class="nav" id="logout">Sign out</button></aside><section class="panel" id="adminMain">Loading…</section></div>`;$('#logout').onclick=()=>signOut(auth);$$('[data-view]').forEach(b=>b.onclick=()=>adminView(b.dataset.view));adminView('dash')}
async function adminView(v){$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(v==='attendance')return attendanceView();if(v==='members')return membersView();if(v==='renewals')return renewalsView();if(v==='raffles')return rafflesView();if(v==='updates')return updatesView();return todayView()}
async function todayView(){const main=$('#adminMain'),key=dateKey(),sref=doc(db,'sessions',key),ss=await getDoc(sref),open=ss.exists()&&ss.data().isOpen;main.innerHTML=`<div class="toolbar"><div><div class="eyebrow">${prettyDate()}</div><h2>Today’s attendance</h2><p><span class="statusdot ${open?'':'closed'}"></span>${open?'Check-in open':'Check-in closed'}</p></div><div class="actions"><button class="btn soft mini" id="manual">Manual check-in</button><button class="btn ${open?'blue':'primary'} mini" id="toggle">${open?'Close check-in':'Open check-in'}</button></div></div><div class="stats"><div class="stat"><span>Checked in</span><b id="tot">0</b></div><div class="stat"><span>Members</span><b id="mem">0</b></div><div class="stat"><span>Visitors</span><b id="vis">0</b></div><div class="stat"><span>First timers</span><b id="first">—</b></div></div><div id="att"></div>`;$('#toggle').onclick=async()=>{await setDoc(sref,{dateKey:key,isOpen:!open,updatedAt:serverTimestamp(),openedBy:currentUser.email},{merge:true});todayView()};$('#manual').onclick=manualCheckin;const qy=query(collection(db,'attendance'),where('dateKey','==',key));if(unSub)unSub();unSub=onSnapshot(qy,snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>timestampMs(a.checkedInAt)-timestampMs(b.checkedInAt));$('#tot').textContent=rows.length;$('#mem').textContent=rows.filter(x=>x.personType==='member').length;$('#vis').textContent=rows.filter(x=>x.personType==='visitor').length;$('#att').innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>Status</th><th>Arrival</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.displayName)}</td><td><span class="pill ${x.personType==='member'?'member':'visitor'}">${x.personType}</span></td><td>${x.checkedInAt?new Date(timestampMs(x.checkedInAt)).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}):'Just now'}</td><td><button class="btn blue mini removeAtt" data-id="${x.id}">Remove</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nobody has checked in yet.</div>';$$('.removeAtt').forEach(b=>b.onclick=async()=>{if(confirm('Remove this attendance record?'))await deleteDoc(doc(db,'attendance',b.dataset.id))})})}
async function manualCheckin(){await loadDirectory();showModal(`<div class="eyebrow">Committee check-in</div><h2>Check someone in</h2><div class="field"><label>Member</label><select id="manualPerson"><option value="">Choose member…</option>${directory.map(p=>`<option value="${p.id}">${esc(p.displayName)}</option>`).join('')}</select></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="manualGo">Check in</button><button class="btn blue" data-close>Cancel</button></div>`);$('#manualGo').onclick=async()=>{const p=directory.find(x=>x.id===$('#manualPerson').value);if(!p)return;await setDoc(doc(db,'attendance',dateKey()+'_'+p.id),{dateKey:dateKey(),personId:p.id,visitorId:'',displayName:p.displayName,personType:'member',memberType:p.memberType,checkedInAt:serverTimestamp(),source:'committee'},{merge:false});closeModal()}}

function rafflePool(){const from=$('#rf').value,to=$('#rt').value,min=Number($('#rmin').value)||1,rule=$('#rrule').value,exclude=$('#rexclude').checked,peopleMap=new Map(adminCache.people.map(p=>[p.id,p])),eligibleAtt=adminCache.attendance.filter(a=>a.personType==='member'&&a.personId&&a.dateKey>=from&&a.dateKey<=to&&peopleMap.has(a.personId));const counts={};eligibleAtt.forEach(a=>counts[a.personId]=(counts[a.personId]||0)+1);let ids=Object.keys(counts).filter(id=>counts[id]>=min);if(exclude){const won=new Set(adminCache.raffles.map(r=>r.winnerPersonId));ids=ids.filter(id=>!won.has(id))}const entries=[];ids.forEach(id=>{const n=rule==='attendance'?counts[id]:1;for(let i=0;i<n;i++)entries.push(id)});return {entries,counts,peopleMap,from,to,min,rule,exclude}}
