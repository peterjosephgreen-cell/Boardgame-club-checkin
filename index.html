<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central Coast Board Games — Check In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--ink:#2b282c;--cream:#fff8ec;--blue:#3f7fbf;--orange:#ff9c1a;--line:#eadfce;--muted:#746e6f;--shadow:0 16px 36px rgba(54,42,34,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at top left,#fff1d8,#fff8ec 38%,#f4efe8);color:var(--ink);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#2d2a2f;color:#fff}
.brand{font-weight:900}.adminlink{border:1px solid #ffffff44;background:#ffffff0c;color:#fff;border-radius:999px;padding:8px 12px}.shell{max-width:1080px;margin:auto;padding:24px 16px 48px}.phone{max-width:480px;margin:auto}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}.hero{overflow:hidden}.hero img{width:100%;display:block;aspect-ratio:2.65/1;object-fit:cover}.pad,.panel{padding:22px}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.78rem;font-weight:950;color:var(--orange)}h1,h2{line-height:1.08;margin:.25em 0 .5em}h1{font-size:clamp(2rem,8vw,3.2rem)}p{line-height:1.55;color:#514d4e}
.stack{display:grid;gap:12px}.btn{border:0;border-radius:16px;padding:14px 18px;min-height:52px;font-weight:900}.primary{background:var(--orange);color:#2a2420}.blue{background:var(--blue);color:white}.soft{background:#f6efe6;color:var(--ink);border:1px solid var(--line)}.text{border:0;background:none;color:var(--blue);font-weight:850;padding:6px}
.field{display:grid;gap:6px}.field label{font-weight:850}.field input,.field select,.search{border:1.5px solid #d7cbbb;border-radius:14px;padding:13px 14px;outline:none;width:100%}.field input:focus,.field select:focus,.search:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff9c1a22}
.hint{font-size:.84rem;color:var(--muted)}.notice{padding:12px 14px;border-radius:14px;background:#fff5dd;border:1px solid #f3d59a}.warning{background:#edf5fd;border-color:#a9c8e7}.success{text-align:center;padding:24px}
.check{width:82px;height:82px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:#fff0d5;color:#a45b00;font-size:2.5rem}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.8rem;font-weight:900}
.member,.lifetime,.child,.prepaid{background:#fff0d5;color:#a45b00}.visitor,.due{background:#e6f0fb;color:#245f99}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.admin{display:grid;grid-template-columns:210px 1fr;gap:18px}.side{background:#2d2a2f;color:#fff;padding:16px;border-radius:24px;align-self:start;position:sticky;top:78px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#e9e4e6;padding:11px;border-radius:12px;font-weight:850}.nav.active,.nav:hover{background:#ffffff16}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{padding:18px;background:#faf6ef;border:1px solid var(--line);border-radius:18px}.stat b{display:block;font-size:2rem}
.mini{min-height:auto;padding:9px 11px;border-radius:10px;font-size:.84rem}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee5da}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.modal{position:fixed;inset:0;background:#211f22b8;z-index:10;display:grid;place-items:center;padding:18px}.modalbox{max-width:520px;width:100%;background:white;border-radius:24px;padding:22px}.winner{font-size:2rem;font-weight:950;text-align:center;padding:22px;background:#fff5dd;border-radius:18px;margin:14px 0}.empty{text-align:center;padding:28px;color:var(--muted)}
.statusdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--orange)}.statusdot.closed{background:var(--blue)}
@media(max-width:760px){.admin{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side h3{display:none}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}.hide-mobile{display:none}}
</style>
</head>

const CFG=window.CCBGC_CONFIG||{};
const configured=CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes('PASTE_') && CFG.SUPABASE_KEY && !CFG.SUPABASE_KEY.includes('PASTE_');
const sb=configured?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let publicMembers=[],currentInfo=null,currentAttendance=null,committeeUser=null,realtimeChannel=null;
const rememberedKey='ccbg_remembered_supabase_v1';
const root=document.getElementById('root');
const phone=x=>root.innerHTML=`<div class="phone">${x}</div>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>new Intl.DateTimeFormat('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d||new Date());
const fmtTime=x=>new Intl.DateTimeFormat('en-AU',{hour:'numeric',minute:'2-digit'}).format(new Date(x));
const renewalSeason=()=>new Date()>=new Date('2026-11-25T00:00:00')?'26/27':'25/26';
function statusLabel(i){if(i.member_type==='lifetime')return 'Lifetime member';if(i.member_type==='child')return 'Child member';if(i.member_type==='visitor')return 'Visitor';if(renewalSeason()==='26/27'&&!i.paid_2627)return 'Renewal due';return renewalSeason()==='26/27'?'26/27 Member':'25/26 Member'}
function pill(i){let l=statusLabel(i),c=(l==='Visitor'||l==='Renewal due')?'visitor':'member';return `<span class="pill ${c}">${esc(l)}</span>`}
function showSetupNeeded(){phone(`<section class="card pad"><div class="eyebrow">Backend setup required</div><h1>Almost connected</h1><p>This build is ready for Supabase, but <b>config.js</b> still needs your project URL and publishable key.</p><div class="notice warning">The member database is deliberately not embedded in this public HTML.</div><p class="hint">Follow README-SETUP.txt in the download package, then upload the configured files to GitHub Pages.</p></section>`)}
async function rpc(name,args={}){let {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
async function loadPublicMembers(){publicMembers=await rpc('public_member_list');}
async function loadInfo(id){let d=await rpc('public_member_info',{p_person_id:id});return d?.[0]||null}
async function showLanding(){if(!configured)return showSetupNeeded();try{await loadPublicMembers()}catch(e){return errorCard('Could not connect to the club database.',e.message)}let id=localStorage.getItem(rememberedKey);if(id){let info=await loadInfo(id).catch(()=>null);if(info)return showRecognised(id,info)}phone(`<section class="card hero"><img src="${LOGO}" alt="Central Coast Board Games logo"><div class="pad"><div class="eyebrow">Welcome</div><h1>Ready to play?</h1><p>Scan once, check in, then get to the games.</p><div class="stack"><button class="btn primary" onclick="showMemberPicker()">I'm a member</button><button class="btn blue" onclick="showNewVisitor()">I'm new / not a member</button></div><p class="hint" style="margin-top:16px">We only use check-in details for club administration, attendance and membership. <b>We will not sell your personal data</b> or share it for third-party marketing.</p></div></section>`)}
function showMemberPicker(){phone(`<section class="card pad"><div class="eyebrow">Member check-in</div><h1>Select your name</h1><p>Choose your name from the member list.</p><div class="field"><label>Name</label><select id="memberSelect"><option value="">Choose your name…</option>${publicMembers.map(m=>`<option value="${m.person_id}">${esc(m.display_name)}</option>`).join('')}</select></div><div class="stack" style="margin-top:14px"><button class="btn primary" onclick="confirmMember()">That's me</button><button class="btn blue" onclick="showLanding()">Go back</button></div></section>`)}
async function confirmMember(){let id=document.getElementById('memberSelect').value;if(!id)return alert('Please choose your name.');let info=await loadInfo(id);showRecognised(id,info)}
async function showRecognised(id,info=null){info=info||await loadInfo(id);currentInfo=info;localStorage.setItem(rememberedKey,id);phone(`<section class="card pad"><div class="eyebrow">Welcome back</div><h1>Hi, ${esc(info.first_name)}.</h1><div class="meta">${pill(info)}</div>${membershipMessage(info)}${info.cclc_missing?`<div class="notice warning"><b>CCLC membership number missing</b><p class="hint">You can submit it now and the committee can verify the update.</p><div class="toolbar"><input id="cclcUpdate" class="search" inputmode="numeric" placeholder="CCLC number"><button class="btn blue mini" onclick="submitCCLC('${id}')">Submit</button></div></div>`:''}<div class="stack" style="margin-top:16px"><button class="btn primary" onclick="checkMember('${id}')">Check me in</button><button class="btn blue" onclick="switchPerson()">Not ${esc(info.first_name)} / switch person</button></div></section>`)}
function membershipMessage(i){if(i.member_type==='lifetime')return `<div class="notice">Lifetime membership — nothing to renew. ✨</div>`;if(i.member_type==='child')return `<div class="notice">Child membership — no membership payment is required.</div>`;if(i.prepaid_2627&&renewalSeason()==='25/26')return `<div class="notice"><b>Your 2026/27 membership is already paid.</b><br><span class="hint">You won't need to pay again when renewals open.</span></div>`;if(renewalSeason()==='26/27'&&!i.paid_2627)return `<div class="notice warning"><b>Membership renewal is due.</b><br><span class="hint">You can still check in today. Please renew your 2026/27 membership.</span>${CFG.SQUARE_PAYMENT_URL?`<p><a class="btn primary" style="display:inline-block;text-decoration:none" href="${esc(CFG.SQUARE_PAYMENT_URL)}" target="_blank">Renew membership</a></p>`:''}</div>`;return `<div class="notice">Membership is current. ✓</div>`}
async function submitCCLC(id){let v=document.getElementById('cclcUpdate').value.trim();if(!v)return;let ok=await rpc('public_submit_cclc',{p_person_id:id,p_cclc_number:v});alert(ok?'Thanks — your CCLC number has been sent to the committee for verification.':'We could not submit that update.');}
function switchPerson(){localStorage.removeItem(rememberedKey);showMemberPicker()}
async function checkMember(id){try{let d=await rpc('public_checkin_member',{p_person_id:id});currentAttendance=d?.[0];let info=await loadInfo(id);showSuccess(info,currentAttendance)}catch(e){if(String(e.message).includes('CHECKIN_CLOSED'))return closedCard();errorCard('Check-in failed',e.message)}}
function showSuccess(info,a){phone(`<section class="card success"><div class="check">✓</div><div class="eyebrow">${a?.already_checked_in?'Already checked in':'Checked in'}</div><h1>You're all set, ${esc(info.first_name)}.</h1><div class="meta" style="justify-content:center">${pill(info)}</div><p>${fmtDate()}<br><b>${a?.checked_in_at?fmtTime(a.checked_in_at):''}</b></p>${membershipMessage(info)}<p>Have a brilliant game day 🎲</p><button class="text" onclick="showLanding()">Back to start</button></section>`)}
function closedCard(){phone(`<section class="card pad"><div class="eyebrow">Check-in closed</div><h1>Not open yet</h1><div class="notice warning">Today's club session hasn't been opened by a committee member yet.</div><p>Please see the committee desk, then try again.</p><button class="btn blue" onclick="showLanding()">Go back</button></section>`)}
function errorCard(title,msg){phone(`<section class="card pad"><div class="eyebrow">Something went wrong</div><h1>${esc(title)}</h1><div class="notice warning">${esc(msg||'Please try again.')}</div><button class="btn blue" style="margin-top:14px" onclick="showLanding()">Go back</button></section>`)}
function showNewVisitor(){phone(`<section class="card pad"><div class="eyebrow">New visitor</div><h1>Welcome to the club!</h1><form class="stack" onsubmit="registerVisitor(event)"><div class="field"><label>First name</label><input name="first" required autocomplete="given-name"></div><div class="field"><label>Surname</label><input name="last" required autocomplete="family-name"></div><div class="field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Postcode</label><input name="postcode" inputmode="numeric" autocomplete="postal-code"></div><div class="field"><label>Central Coast Leagues Club membership number</label><input name="cclc" inputmode="numeric" placeholder="Leave blank if you don't have one yet"></div><div class="field"><label>Age / membership type</label><select name="ageType"><option value="adult">Adult (18+)</option><option value="child">Under 18 / child</option></select></div><div class="hint">We use these details only for club administration, attendance records and membership purposes. <b>Central Coast Board Games will not sell your personal data</b> or share it for third-party marketing.</div><button class="btn primary">Check in</button><button type="button" class="btn blue" onclick="showLanding()">Go back</button></form></section>`)}
async function registerVisitor(e){e.preventDefault();let f=new FormData(e.target);try{let d=await rpc('public_register_and_checkin',{p_first_name:f.get('first'),p_last_name:f.get('last'),p_email:f.get('email'),p_postcode:f.get('postcode'),p_cclc_number:f.get('cclc'),p_age_type:f.get('ageType')}),r=d?.[0];showVisitorSuccess(r)}catch(err){if(String(err.message).includes('CHECKIN_CLOSED'))return closedCard();errorCard('Could not register check-in',err.message)}}
function showVisitorSuccess(r){let child=r.member_type==='child';phone(`<section class="card success"><div class="check">✓</div><div class="eyebrow">Checked in</div><h1>Welcome, ${esc(r.first_name)}.</h1><div class="meta" style="justify-content:center"><span class="pill ${child?'member':'visitor'}">${child?'Child member':'Visitor'}</span></div><p>${fmtDate()}<br><b>${fmtTime(r.checked_in_at)}</b></p>${child?`<div class="notice">Child membership is free — no membership payment is required.</div>`:`<div class="notice warning">Please say hello to a committee member if you'd like to join the club.</div>`}<p>Have a brilliant game day 🎲</p><button class="btn blue" onclick="showLanding()">Back to start</button></section>`)}

// Committee
async function showCommittee(tab='today'){if(!configured)return showSetupNeeded();let {data:{session}}=await sb.auth.getSession();if(!session)return showCommitteeLogin();let me=await rpc('committee_me');if(!me?.[0]?.allowed)return phone(`<section class="card pad"><div class="eyebrow">Committee</div><h1>Access not authorised</h1><p>You're signed in as <b>${esc(session.user.email)}</b>, but that email is not on the committee access list.</p><button class="btn blue" onclick="committeeSignOut()">Sign out</button></section>`);committeeUser=me[0];renderCommitteeShell(tab)}
function showCommitteeLogin(){phone(`<section class="card pad"><div class="eyebrow">Committee access</div><h1>Sign in</h1><p>We'll email you a secure sign-in link. Only authorised committee email addresses can access private member information.</p><div class="field"><label>Committee email</label><input id="committeeEmail" type="email" autocomplete="email"></div><button class="btn primary" style="margin-top:14px;width:100%" onclick="sendMagicLink()">Email me a sign-in link</button><button class="btn blue" style="margin-top:10px;width:100%" onclick="showLanding()">Go back</button></section>`)}
async function sendMagicLink(){let email=document.getElementById('committeeEmail').value.trim();if(!email)return;let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error)return alert(error.message);alert('Sign-in link sent. Open the email on this device and tap the link.');}
async function committeeSignOut(){await sb.auth.signOut();if(realtimeChannel)sb.removeChannel(realtimeChannel);showLanding()}
const tabs={today:'Today',history:'Attendance',people:'People',updates:'Updates',raffle:'Raffle',settings:'Settings'};
function renderCommitteeShell(tab){root.innerHTML=`<div class="admin"><aside class="side"><h3>Committee</h3>${Object.entries(tabs).map(([k,v])=>`<button class="nav ${k===tab?'active':''}" onclick="renderCommitteeShell('${k}')">${v}</button>`).join('')}<button class="nav" onclick="showLanding()">← Check-in view</button></aside><section id="panel"></section></div>`;if(tab==='today')renderToday();if(tab==='history')renderHistory();if(tab==='people')renderPeople();if(tab==='updates')renderUpdates();if(tab==='raffle')renderRaffle();if(tab==='settings')renderSettings()}
async function todaySession(){let d=new Date().toISOString().slice(0,10);let {data,error}=await sb.from('club_sessions').select('*').eq('session_date',d).maybeSingle();if(error)throw error;return data}
async function ensureTodaySession(open){let d=new Date().toISOString().slice(0,10),s=await todaySession();if(!s){let {data,error}=await sb.from('club_sessions').insert({session_date:d,is_open:open,opened_at:open?new Date().toISOString():null}).select().single();if(error)throw error;return data}let patch={is_open:open};if(open)patch.opened_at=new Date().toISOString();else patch.closed_at=new Date().toISOString();let {data,error}=await sb.from('club_sessions').update(patch).eq('id',s.id).select().single();if(error)throw error;return data}
async function fetchTodayRows(){let d=new Date().toISOString().slice(0,10);let {data,error}=await sb.from('attendance').select('id,checked_in_at,method,people(id,first_name,last_name,member_type,cclc_number),club_sessions!inner(session_date)').eq('club_sessions.session_date',d).order('checked_in_at');if(error)throw error;return data||[]}
async function renderToday(){let panel=document.getElementById('panel');panel.innerHTML='<div class="panel"><div class="empty">Loading…</div></div>';let s=await todaySession(),rows=await fetchTodayRows();let members=rows.filter(r=>r.people?.member_type!=='visitor').length;panel.innerHTML=`<div class="panel"><div class="toolbar"><div><div class="eyebrow">Today's session</div><h2>${fmtDate()}</h2><div><span class="statusdot ${s?.is_open?'':'closed'}"></span><b>${s?.is_open?'Check-in is OPEN':'Check-in is CLOSED'}</b></div></div><button class="btn ${s?.is_open?'blue':'primary'} mini" onclick="toggleSession(${s?.is_open?'false':'true'})">${s?.is_open?'Close check-in':'Open check-in'}</button></div><div class="stats"><div class="stat"><span>Checked in</span><b>${rows.length}</b></div><div class="stat"><span>Members</span><b>${members}</b></div><div class="stat"><span>Visitors</span><b>${rows.length-members}</b></div></div>${attendanceTable(rows)}</div>`;subscribeAttendance()}
function attendanceTable(rows){if(!rows.length)return '<div class="empty">No one is checked in yet.</div>';return `<table><thead><tr><th>Name</th><th>Status</th><th>Arrival</th><th class="hide-mobile">CCLC</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.people.first_name)} ${esc(r.people.last_name)}</b></td><td><span class="pill ${r.people.member_type==='visitor'?'visitor':'member'}">${esc(r.people.member_type==='visitor'?'Visitor':r.people.member_type==='lifetime'?'Lifetime':r.people.member_type==='child'?'Child':'Member')}</span></td><td>${fmtTime(r.checked_in_at)}</td><td class="hide-mobile">${esc(r.people.cclc_number||'—')}</td></tr>`).join('')}</tbody></table>`}
async function toggleSession(open){try{await ensureTodaySession(open);renderToday()}catch(e){alert(e.message)}}
function subscribeAttendance(){if(realtimeChannel)return;realtimeChannel=sb.channel('committee-attendance').on('postgres_changes',{event:'*',schema:'public',table:'attendance'},()=>{if(document.getElementById('panel'))renderToday()}).subscribe()}
async function renderPeople(){let p=document.getElementById('panel');p.innerHTML='<div class="panel"><div class="empty">Loading…</div></div>';let {data,error}=await sb.from('people').select('id,legacy_id,first_name,last_name,email,postcode,cclc_number,member_type,notes,memberships(membership_year,status,paid_at)').order('last_name');if(error)return p.innerHTML=`<div class="panel"><div class="notice warning">${esc(error.message)}</div></div>`;p.innerHTML=`<div class="panel"><div class="eyebrow">Membership database</div><h2>${data.length} people</h2><input class="search" id="peopleQ" placeholder="Search name, email or CCLC" oninput="filterPeople()"><table id="peopleTable"><thead><tr><th>Name</th><th>Status</th><th>CCLC</th><th class="hide-mobile">Email</th><th>26/27</th></tr></thead><tbody>${data.map(x=>{let paid=x.member_type==='lifetime'?'Never due':x.member_type==='child'?'Free':x.memberships?.some(m=>m.membership_year==='26/27')?'Paid':'—';return `<tr data-search="${esc((x.first_name+' '+x.last_name+' '+(x.email||'')+' '+(x.cclc_number||'')).toLowerCase())}"><td><b>${esc(x.first_name)} ${esc(x.last_name)}</b><br><span class="hint">${esc(x.legacy_id||x.id)}</span></td><td><span class="pill ${x.member_type==='visitor'?'visitor':'member'}">${esc(x.member_type)}</span></td><td>${esc(x.cclc_number||'Missing')}</td><td class="hide-mobile">${esc(x.email||'—')}</td><td>${paid}</td></tr>`}).join('')}</tbody></table></div>`}
function filterPeople(){let q=document.getElementById('peopleQ').value.toLowerCase();document.querySelectorAll('#peopleTable tbody tr').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
async function renderHistory(){let p=document.getElementById('panel');let {data,error}=await sb.from('club_sessions').select('id,session_date,is_open,attendance(count)').order('session_date',{ascending:false}).limit(50);if(error)return;p.innerHTML=`<div class="panel"><div class="eyebrow">Attendance history</div><h2>Past sessions</h2>${data.length?data.map(s=>`<div style="padding:14px 0;border-bottom:1px solid #eee"><b>${new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'long',year:'numeric'}).format(new Date(s.session_date+'T12:00:00'))}</b><div class="hint">${s.attendance?.[0]?.count||0} attendees · ${s.is_open?'Open':'Closed'}</div></div>`).join(''):'<div class="empty">No sessions yet.</div>'}</div>`}
async function renderUpdates(){let p=document.getElementById('panel');let {data,error}=await sb.from('profile_update_requests').select('id,proposed_value,status,created_at,people(id,first_name,last_name,cclc_number)').eq('status','pending').order('created_at');if(error)return;p.innerHTML=`<div class="panel"><div class="eyebrow">Member updates</div><h2>Pending CCLC numbers</h2>${data.length?data.map(r=>`<div class="toolbar" style="padding:12px 0;border-bottom:1px solid #eee"><div><b>${esc(r.people.first_name)} ${esc(r.people.last_name)}</b><br><span class="hint">Current: ${esc(r.people.cclc_number||'missing')} · Proposed: <b>${esc(r.proposed_value)}</b></span></div><div><button class="btn primary mini" onclick="reviewUpdate('${r.id}','${r.people.id}','${esc(r.proposed_value)}',true)">Approve</button> <button class="btn blue mini" onclick="reviewUpdate('${r.id}','${r.people.id}','',false)">Reject</button></div></div>`).join(''):'<div class="empty">No pending updates.</div>'}</div>`}
async function reviewUpdate(rid,pid,value,approve){if(approve){let {error}=await sb.from('people').update({cclc_number:value}).eq('id',pid);if(error)return alert(error.message)}let {error}=await sb.from('profile_update_requests').update({status:approve?'approved':'rejected',reviewed_at:new Date().toISOString()}).eq('id',rid);if(error)return alert(error.message);renderUpdates()}
async function renderRaffle(){let p=document.getElementById('panel'),rows=await fetchTodayRows(),eligible=rows.filter(r=>r.people.member_type!=='visitor');p.innerHTML=`<div class="panel"><div class="eyebrow">Attendance raffle</div><h2>Draw from today's members</h2><p>Visitors are excluded. Adult, child and lifetime members checked in today are eligible.</p><div class="notice"><b>${eligible.length}</b> eligible entries.</div><div id="winner"></div><button class="btn primary" style="margin-top:14px" onclick="drawRaffle()" ${eligible.length?'':'disabled'}>🎟️ Draw winner</button></div>`}
async function drawRaffle(){let rows=await fetchTodayRows(),e=rows.filter(r=>r.people.member_type!=='visitor');if(!e.length)return;let r=e[Math.floor(Math.random()*e.length)],s=await todaySession();await sb.from('raffle_draws').insert({session_id:s?.id,person_id:r.people.id,drawn_by_email:committeeUser.email});document.getElementById('winner').innerHTML=`<div class="winner">🏆 ${esc(r.people.first_name)} ${esc(r.people.last_name)}</div>`}
function renderSettings(){document.getElementById('panel').innerHTML=`<div class="panel"><div class="eyebrow">Settings</div><h2>Committee account</h2><p>Signed in as <b>${esc(committeeUser.email)}</b> (${esc(committeeUser.role)}).</p><div class="notice">Membership year rules: 25/26 through 24/11/2026; 26/27 begins 25/11/2026.</div><button class="btn blue" style="margin-top:14px" onclick="committeeSignOut()">Sign out</button></div>`}
sb?.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)setTimeout(()=>showCommittee(),0)});
showLanding();
</script>
</body></html>
