<body><div class="top"><div class="brand">🎲 Central Coast Board Games</div><button class="adminlink" id="committeeBtn">Committee</button></div><main class="shell" id="root"></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,onSnapshot,serverTimestamp,Timestamp,arrayUnion,arrayRemove} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
const cfg=window.CLUB_FIREBASE_CONFIG, root=document.querySelector('#root');
if(!cfg?.projectId){root.innerHTML='<div class="panel"><h2>Firebase setup required</h2><p>firebase-config.js is missing or incorrect.</p></div>';throw new Error('No Firebase config');}
const app=initializeApp(cfg), auth=getAuth(app), db=getFirestore(app); let directory=[], currentUser=null, unSub=null, clubSettings={carryForwardMonth:11,carryForwardDay:1,annualFeeCents:1000,clubName:'Central Coast Board Games'}, adminCache={people:[],memberships:[],attendance:[],visitors:[],raffles:[],payments:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Sydney',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function prettyDate(d=new Date()){return new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}
function displayDate(k){if(!k)return '—';const [y,m,d]=k.split('-');return `${d}/${m}/${y}`}
function timestampMs(v){if(!v)return 0;if(v.seconds)return v.seconds*1000;if(v.toMillis)return v.toMillis();return new Date(v).getTime()||0}

function yearDocPart(label){return String(label).replace(/[^0-9A-Za-z_-]/g,'-')}
function membershipContext(when=new Date()){
  const [y,m,d]=dateKey(when).split('-').map(Number), cm=Number(clubSettings.carryForwardMonth||11), cd=Number(clubSettings.carryForwardDay||1);
  const cutoffActive=m>cm||(m===cm&&d>=cd);
  return {current:String(y),next:String(y+1),year:y,cutoffActive,renewalDue:`${y}-01-01`,graceEnds:`${y}-03-31`,carryForward:`${y}-${String(cm).padStart(2,'0')}-${String(cd).padStart(2,'0')}`};
}
function paidStatuses(){return ['paid','prepaid','active']}
function normalizeMembershipYear(v){
  const s=String(v||'').trim();
  if(/^20\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{2})\/(\d{2})$/);if(m)return String(2000+Number(m[2]));
  return s;
}
function hasMembershipYear(memberships,year){return memberships.some(m=>normalizeMembershipYear(m.membershipYear)===String(year)&&paidStatuses().includes(m.status))}
function publicPaidYears(p){
  const years=new Set((Array.isArray(p.paidYears)?p.paidYears:[]).map(normalizeMembershipYear));
  if(p.paid2526)years.add('2026');
  if(p.prepaid2627)years.add('2027');
  return years;
}
function joinedThisYearAfterCutoff(person,when=new Date()){
  const ctx=membershipContext(when),j=String(person?.joinedDate||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(j))return false;
  return j>=ctx.carryForward&&j<=`${ctx.current}-12-31`;
}
function graceActive(when=new Date()){const k=dateKey(when),ctx=membershipContext(when);return k>=ctx.renewalDue&&k<=ctx.graceEnds}
function membershipStatus(person,memberships=[],when=new Date()){
  if(person.memberType==='lifetime') return {key:'lifetime',label:'Lifetime member'};
  if(person.memberType==='child') return {key:'child',label:'Junior member'};
  const ctx=membershipContext(when),hasCurrent=hasMembershipYear(memberships,ctx.current),hasNext=hasMembershipYear(memberships,ctx.next);
  if(!hasCurrent){
    if(graceActive(when))return {key:'grace',label:`${ctx.current} renewal in grace period`,year:ctx.current};
    if(person.joinedDate&&String(person.joinedDate).startsWith(ctx.current))return {key:'due',label:`${ctx.current} membership payment required`,year:ctx.current};
    return {key:'lapsed',label:`Membership lapsed · ${ctx.current} unpaid`,year:ctx.current};
  }
  if(hasNext)return {key:'prepaid',label:`${ctx.next} paid`,year:ctx.next};
  if(ctx.cutoffActive)return {key:'renewal',label:`${ctx.next} renewal available`,year:ctx.next};
  return {key:'active',label:`Active ${ctx.current}`,year:ctx.current};
}
function effectivePublicStatus(p,when=new Date()){
  if(p.memberType==='lifetime')return 'Lifetime member';
  if(p.memberType==='child')return 'Junior member';
  const ctx=membershipContext(when),years=publicPaidYears(p),hasCurrent=years.has(ctx.current),hasNext=years.has(ctx.next);
  if(!hasCurrent){
    if(graceActive(when))return `${ctx.current} renewal in grace period`;
    if(p.joinedDate&&String(p.joinedDate).startsWith(ctx.current))return `${ctx.current} membership payment required`;
    return `Membership lapsed · ${ctx.current} unpaid`;
  }
  if(hasNext)return `${ctx.next} paid`;
  if(ctx.cutoffActive)return `${ctx.next} renewal available`;
  return `Active ${ctx.current}`;
}
function publicPaymentPlan(p,when=new Date()){
  if(p.memberType!=='adult')return null;
  const ctx=membershipContext(when),years=publicPaidYears(p),hasCurrent=years.has(ctx.current),hasNext=years.has(ctx.next);
  if(!hasCurrent){const coverage=[ctx.current];if(joinedThisYearAfterCutoff(p,when))coverage.push(ctx.next);return {target:ctx.current,coverage,newMemberCarryForward:coverage.length>1}}
  if(ctx.cutoffActive&&!hasNext)return {target:ctx.next,coverage:[ctx.next],newMemberCarryForward:false};
  return null;
}
async function loadClubSettings(){
  try{
    const s=await getDoc(doc(db,'clubSettings','membership'));
    if(s.exists())clubSettings={...clubSettings,...s.data()};
  }catch(e){console.warn('Using default membership settings',e)}
}
async function loadDirectory(){await loadClubSettings();const snap=await getDocs(collection(db,'publicMembers'));directory=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.displayName.localeCompare(b.displayName));}
function wrap(x){root.innerHTML='<div class="phone">'+x+'</div>'}

function renderRenewTable(filter,rows,when=new Date()){const ctx=membershipContext(when),r=rows.filter(x=>filter==='all'||x.st.key===filter).sort((a,b)=>a.p.displayName.localeCompare(b.p.displayName));$('#renewTable').innerHTML=`<table><thead><tr><th>Name</th><th>Status</th><th>Type</th><th>CCLC</th><th>Action</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.p.displayName)}</td><td><span class="pill ${x.st.key}">${esc(x.st.label)}</span></td><td>${esc(x.p.memberType==='child'?'junior':x.p.memberType)}</td><td>${esc(x.p.cclcNumber||'—')}</td><td>${['due','grace','lapsed'].includes(x.st.key)?`<button class="btn primary mini markPaid" data-id="${x.p.id}" data-year="${ctx.current}">Mark ${ctx.current} paid</button>`:x.st.key==='renewal'?`<button class="btn primary mini markPaid" data-id="${x.p.id}" data-year="${ctx.next}">Mark ${ctx.next} paid</button>`:'—'}</td></tr>`).join('')}</tbody></table>`;$$('.markPaid').forEach(b=>b.onclick=async()=>{const p=adminCache.people.find(x=>x.id===b.dataset.id),year=b.dataset.year;await setDoc(doc(db,'memberships',p.id+'_'+yearDocPart(year)),{personId:p.id,membershipYear:year,status:year===ctx.next?'prepaid':'paid',paidAt:dateKey(),paymentSource:'Committee manual',notes:'Marked paid in renewal dashboard'},{merge:true});await setDoc(doc(db,'publicMembers',p.id),{paidYears:arrayUnion(year)},{merge:true});renewalsView()})}
async function rafflesView(){await loadAdminData();const main=$('#adminMain'),dates=adminCache.attendance.map(a=>a.dateKey).filter(Boolean).sort(),min=dates[0]||dateKey(),max=dates.at(-1)||dateKey();main.innerHTML=`<div class="eyebrow">Attendance-based draws</div><h2>Raffles</h2><div class="grid3"><div class="field"><label>From</label><input type="date" id="rf" value="${min}"></div><div class="field"><label>To</label><input type="date" id="rt" value="${max}"></div><div class="field"><label>Entry rule</label><select id="rrule"><option value="attendance">One entry per attendance</option><option value="member">One entry per member</option></select></div></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Minimum attendances</label><input type="number" id="rmin" min="1" value="1"></div><div class="field"><label><input type="checkbox" id="rexclude" checked> Exclude previous raffle winners</label></div></div><div class="actions" style="margin-top:14px"><button class="btn soft" id="previewR">Preview entries</button><button class="btn primary" id="drawR">Draw winner</button></div><div id="rpreview"></div><div class="section"><h3>Previous draws</h3><div id="raffleHistory"></div></div>`;$('#previewR').onclick=()=>previewRaffle(false);$('#drawR').onclick=()=>previewRaffle(true);renderRaffleHistory()}
function rafflePool(){const from=$('#rf').value,to=$('#rt').value,min=Number($('#rmin').value)||1,rule=$('#rrule').value,exclude=$('#rexclude').checked,peopleMap=new Map(adminCache.people.map(p=>[p.id,p])),eligibleAtt=adminCache.attendance.filter(a=>a.personType==='member'&&a.personId&&a.dateKey>=from&&a.dateKey<=to&&peopleMap.has(a.personId));const counts={};eligibleAtt.forEach(a=>counts[a.personId]=(counts[a.personId]||0)+1);let ids=Object.keys(counts).filter(id=>counts[id]>=min);if(exclude){const won=new Set(adminCache.raffles.map(r=>r.winnerPersonId));ids=ids.filter(id=>!won.has(id))}const entries=[];ids.forEach(id=>{const n=rule==='attendance'?counts[id]:1;for(let i=0;i<n;i++)entries.push(id)});return {entries,counts,peopleMap,from,to,min,rule,exclude}}
async function previewRaffle(draw){const p=rafflePool(),unique=new Set(p.entries).size;$('#rpreview').innerHTML=`<div class="notice" style="margin-top:14px"><b>${p.entries.length} raffle entries</b> across ${unique} eligible members.</div>`;if(!draw)return;if(!p.entries.length){$('#rpreview').innerHTML+='<div class="notice warning">No eligible entries for these settings.</div>';return}const winnerId=p.entries[Math.floor(Math.random()*p.entries.length)],winner=p.peopleMap.get(winnerId);await addDoc(collection(db,'raffleDraws'),{winnerPersonId:winnerId,winnerName:winner.displayName,fromDate:p.from,toDate:p.to,entryRule:p.rule,minimumAttendances:p.min,excludedPreviousWinners:p.exclude,totalEntries:p.entries.length,eligibleMembers:unique,winnerAttendances:p.counts[winnerId],drawnAt:serverTimestamp(),drawnBy:currentUser.email});$('#rpreview').innerHTML=`<div class="winner"><div class="eyebrow">Winner</div><strong>🏆 ${esc(winner.displayName)}</strong><p>${p.counts[winnerId]} attendance${p.counts[winnerId]===1?'':'s'} in the selected period</p></div>`;await loadAdminData();renderRaffleHistory()}
function renderRaffleHistory(){const rows=[...adminCache.raffles].sort((a,b)=>timestampMs(b.drawnAt)-timestampMs(a.drawnAt));$('#raffleHistory').innerHTML=rows.length?`<table><thead><tr><th>Winner</th><th>Period</th><th>Entries</th><th>Drawn</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.winnerName)}</td><td>${displayDate(r.fromDate)} – ${displayDate(r.toDate)}</td><td>${r.totalEntries||'—'}</td><td>${r.drawnAt?new Date(timestampMs(r.drawnAt)).toLocaleDateString('en-AU'):'Just now'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No raffle draws recorded yet.</div>'}
async function updatesView(){const main=$('#adminMain'),qy=query(collection(db,'profileUpdates'),where('status','==','pending')),s=await getDocs(qy),rows=s.docs.map(d=>({id:d.id,...d.data()}));main.innerHTML=`<div class="eyebrow">Member-submitted changes</div><h2>Pending updates</h2>${rows.length?rows.map(x=>`<div class="notice warning" style="margin:10px 0"><b>${esc(x.displayName)}</b><br>CCLC: ${esc(x.cclcNumber)}<div style="margin-top:8px"><button class="btn primary mini approve" data-id="${x.id}" data-p="${x.personId}" data-c="${esc(x.cclcNumber)}">Approve</button></div></div>`).join(''):'<div class="empty">No pending updates.</div>'}`;$$('.approve').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'people',b.dataset.p),{cclcNumber:b.dataset.c,updatedAt:serverTimestamp()});await updateDoc(doc(db,'publicMembers',b.dataset.p),{hasCCLC:true});await updateDoc(doc(db,'profileUpdates',b.dataset.id),{status:'approved',approvedAt:serverTimestamp(),approvedBy:currentUser.email});updatesView()})}

async function systemView(){await loadAdminData();const main=$('#adminMain'),fee=(Number(clubSettings.annualFeeCents||1000)/100).toFixed(2);main.innerHTML=`<div class="eyebrow">Membership settings & maintenance</div><h2>System</h2><div class="grid2"><div class="notice"><h3>Membership settings</h3><div class="field"><label>Annual adult fee (AUD)</label><input id="setFee" type="number" min="0" step="0.01" value="${fee}"></div><div class="notice warning" style="margin-top:12px"><b>Membership year: 1 January–31 December</b><br><span class="hint">Fixed to match the Club Constitution. Renewal fees are due from 1 January and the constitutional three-month non-payment period runs through 31 March.</span></div><div class="grid2" style="margin-top:12px"><div class="field"><label>New-member carry-forward — day</label><input id="setCarryDay" type="number" min="1" max="31" value="${clubSettings.carryForwardDay||1}"></div><div class="field"><label>Month</label><select id="setCarryMonth">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${Number(clubSettings.carryForwardMonth||11)===i+1?'selected':''}>${new Date(2000,i,1).toLocaleString('en-AU',{month:'long'})}</option>`).join('')}</select></div></div><button class="btn primary mini" id="saveSettings" style="margin-top:12px">Save membership settings</button><p class="hint">The carry-forward date controls when a newly admitted member’s $${fee} payment also covers the following calendar year. Current club policy is 1 November.</p></div><div class="notice warning"><h3>Backup & data health</h3><p>Download a full JSON backup or run checks for missing and inconsistent data.</p><div class="actions"><button class="btn soft mini" id="backupJson">Download full backup</button><button class="btn primary mini" id="runHealth">Run data-health check</button></div></div></div><div id="healthResults" class="section"></div>`;$('#saveSettings').onclick=saveMembershipSettings;$('#backupJson').onclick=downloadFullBackup;$('#runHealth').onclick=renderDataHealth}
async function saveMembershipSettings(){const fee=Math.round(Number($('#setFee').value)*100),day=Number($('#setCarryDay').value),month=Number($('#setCarryMonth').value);if(!Number.isFinite(fee)||fee<0||day<1||day>31||month<1||month>12){alert('Please check the membership settings.');return}await setDoc(doc(db,'clubSettings','membership'),{annualFeeCents:fee,carryForwardDay:day,carryForwardMonth:month,membershipBasis:'calendar-year',renewalDueMonth:1,renewalDueDay:1,graceMonths:3,updatedAt:serverTimestamp(),updatedBy:currentUser.email},{merge:true});await loadClubSettings();alert('Membership settings saved.');systemView()}
async function downloadFullBackup(){await loadAdminData();const updates=await getDocs(collection(db,'profileUpdates')),settings=await getDoc(doc(db,'clubSettings','membership'));const data={exportedAt:new Date().toISOString(),settings:settings.exists()?settings.data():clubSettings,people:adminCache.people,memberships:adminCache.memberships,attendance:adminCache.attendance,visitors:adminCache.visitors,payments:adminCache.payments,raffles:adminCache.raffles,profileUpdates:updates.docs.map(d=>({id:d.id,...d.data()}))};downloadBlob(JSON.stringify(data,(k,v)=>v&&typeof v==='object'&&typeof v.toDate==='function'?v.toDate().toISOString():v,2),'ccbg-full-backup-'+dateKey()+'.json','application/json')}
function dataHealthIssues(){const issues=[],peopleIds=new Set(adminCache.people.map(p=>p.id)),publicIds=new Set(directory.map(p=>p.id)),emailMap={};for(const p of adminCache.people){if(!p.email)issues.push({type:'Missing email',name:p.displayName,detail:'Member has no email address'});if(!p.cclcNumber)issues.push({type:'Missing CCLC',name:p.displayName,detail:'No CCLC membership number'});if(p.email){const e=p.email.trim().toLowerCase();(emailMap[e]??=[]).push(p.displayName)}}for(const [email,names] of Object.entries(emailMap))if(names.length>1)issues.push({type:'Duplicate email',name:names.join(' / '),detail:email});for(const m of adminCache.memberships)if(!peopleIds.has(m.personId))issues.push({type:'Orphan membership',name:m.personId||m.id,detail:m.membershipYear||''});for(const a of adminCache.attendance)if(a.personType==='member'&&a.personId&&!peopleIds.has(a.personId))issues.push({type:'Orphan attendance',name:a.displayName||a.personId,detail:a.dateKey||''});for(const p of adminCache.people)if(!publicIds.has(p.id))issues.push({type:'Missing public record',name:p.displayName,detail:'Member is missing from publicMembers'});return issues}
async function renderDataHealth(){await loadDirectory();const issues=dataHealthIssues(),box=$('#healthResults');box.innerHTML=`<h3>Data health</h3>${issues.length?`<div class="notice warning"><b>${issues.length} item${issues.length===1?'':'s'} to review</b></div><table><thead><tr><th>Issue</th><th>Member / record</th><th>Detail</th></tr></thead><tbody>${issues.map(i=>`<tr><td>${esc(i.type)}</td><td>${esc(i.name)}</td><td>${esc(i.detail)}</td></tr>`).join('')}</tbody></table>`:'<div class="notice"><b>✓ No data-health issues found.</b><br>Member, membership and attendance references look consistent.</div>'}`}
function showModal(html){const d=document.createElement('div');d.className='modalback';d.id='modalBack';d.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(d);d.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);d.onclick=e=>{if(e.target===d)closeModal()}}
function closeModal(){document.querySelector('#modalBack')?.remove()}
document.querySelector('#committeeBtn').onclick=committee;onAuthStateChanged(auth,u=>{currentUser=u;if(!u&&root.querySelector?.('.admin'))home();else if(u&&root.textContent.includes('Sign in'))dashboard()});loadClubSettings().then(()=>paymentReturn()).then(handled=>{if(!handled)home().catch(e=>{root.innerHTML=`<div class="panel"><h2>Connection problem</h2><p>${esc(e.message)}</p><p class="hint">Check Firestore rules and that the member import has been completed.</p></div>`})});
</script></body></html>
